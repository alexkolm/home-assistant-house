# Loads default set of integrations. Do not remove.
default_config:

# Потери и задержка ping контроллера котла нужны только живому
# JSON-логу связи. В recorder их не кладём: RTT меняется каждый цикл,
# а база и так большая. Сам ping и watchdog от этого не меняются.
# Часы Awtrix: кадр, аптайм, память и RSSI меняются каждые секунды.
# Температура, влажность и освещённость остаются в истории.
recorder:
  exclude:
    entities:
      - sensor.gas_ping_packet_loss
      - sensor.gas_ping_round_trip_time_average
      - sensor.gas_ping_jitter
      - sensor.awtrix_1ed68c_current_app
      - sensor.awtrix_1ed68c_uptime
      - sensor.awtrix_1ed68c_free_ram
      - sensor.awtrix_1ed68c_wifi_strength

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

openhasp: !include openhasp.yaml

group:
  family:
    name: Owners
    entities:
      - device_tracker.alex
      - device_tracker.tanya

camera:
  - platform: ffmpeg
    name: domofon_audio
    input: !secret domofon_rtsp_url

shell_command:
  record_domofon_video: !secret domofon_record_cmd
  delete_domofon_video: rm -f /config/www/domofon.mp4
  # Копия со штампом. Исходный mp4 удаляется только после успешного копирования,
  # чтобы следующая запись не смешалась с клипом, который ещё уходит в Telegram.
  save_domofon_clip: >-
    sh -c 'cp -f /config/www/domofon.jpg "$1" || true; if [ -s /config/www/domofon.mp4 ]; then cp -f /config/www/domofon.mp4 "$2" && rm -f /config/www/domofon.mp4; fi' sh "{{ photo }}" "{{ video }}"
  # Всегда код 0: в stdout yes или no. Так проверка файла не выглядит как ошибка команды.
  domofon_file_ready: 'test -s "{{ path }}" && echo yes || echo no'
  delete_domofon_file: 'rm -f "{{ path }}"'
  # Самый старый неотправленный кадр и парный ролик. Пустой stdout — очереди нет.
  next_domofon_clip: >-
    sh -c 'photo=$(ls -1 /config/www/domofon_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9].jpg 2>/dev/null | sort | head -1); [ -n "$photo" ] || exit 0; printf "%s\n%s" "$photo" "${photo%.jpg}.mp4"'
  # Сутки без Telegram: клип уже не отправляем, чтобы www не копился.
  prune_domofon_clips: >-
    find /config/www -maxdepth 1 -type f \( -name 'domofon_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9].jpg' -o -name 'domofon_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9].mp4' \) -mmin +1440 -delete
  trim_boiler_link_log: python3 /config/boiler_link_trim.py
  boiler_link_append: "python3 /config/boiler_link_append.py {{ payload_b64 }}"

rest_command:
  domofon_open_door:
    url: !secret domofon_url
    method: PUT
    username: !secret domofon_user
    password: !secret domofon_password
    authentication: digest
    headers:
      Content-Type: application/xml
    payload: '<RemoteControlDoor><cmd>open</cmd></RemoteControlDoor>'

  domofon_reject_call:
    url: !secret domofon_callsignal_json_url
    method: PUT
    username: !secret domofon_user
    password: !secret domofon_password
    authentication: digest
    headers:
      Content-Type: application/json
    payload: '{"CallSignal":{"cmdType":"reject"}}'

  wled_preset_1:
    url: "http://192.168.0.143/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"ps":1}'

  wled_preset_2:
    url: "http://192.168.0.143/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"ps":2}'

input_boolean:
  notify_door:
    name: Уведомления от входной двери
    icon: mdi:door

  notify_away_home:
    name: Уехали надолго
    icon: mdi:airplane-takeoff

  notify_offline:
    name: Уведомления об обрыве связи
    icon: mdi:ethernet-cable-off

  notify_boiler:
    name: Запуск отопления по температуре
    icon: mdi:home-thermometer

  notify_count:
    name: Показания счетчиков переданы
    icon: mdi:counter

  test_gate_open:
    name: Тестовая кнопка замка
    icon: mdi:lock-open-variant

  heating_relay_virtual:
    name: Реле отопления
    icon: mdi:fire

  climate_daily:
    name: Режимы термостата по графику
    icon: mdi:timer-refresh

  bedroom_presence_state:
    name: Присутствие в спальне
    icon: mdi:bed

input_select:
  heating_temp_source:
    name: Источник температуры отопления
    icon: mdi:thermometer-lines
    options:
      - livingroom
      - bedroom
      - none
    initial: livingroom

input_text:
  heating_sensor_recover_since:
    name: Гостиная — первый пакет после обрыва
    icon: mdi:timer-sand
    min: 0
    max: 40
    initial: "none"
    mode: text

input_number:
  boiler_starts_last_hour:
    name: Boiler starts last hour
    min: 0
    max: 100
    step: 1

  boiler_starts_previous_hour:
    name: Такты горелки за предыдущий час
    min: 0
    max: 100
    step: 1
  boiler_starts_current_cycle:
    name: Такты горелки за текущий цикл
    min: 0
    max: 200
    step: 1
    icon: mdi:fire-circle

  # Выдержка кадров Awtrix. Часы — штатное приложение Time (настройка ATIME).
  # Комната, влажность и улица — свои приложения, у каждого своя длительность.
  # initial срабатывает только при создании сущности.
  awtrix_time_seconds:
    name: Awtrix — часы, секунды
    min: 1
    max: 30
    step: 1
    initial: 4
    mode: box
    icon: mdi:clock-digital

  awtrix_temp_seconds:
    name: Awtrix — температура, секунды
    min: 1
    max: 30
    step: 1
    initial: 1
    mode: box
    icon: mdi:thermometer

  awtrix_hum_seconds:
    name: Awtrix — влажность, секунды
    min: 1
    max: 30
    step: 1
    initial: 1
    mode: box
    icon: mdi:water-percent

  awtrix_yard_seconds:
    name: Awtrix — улица, секунды
    min: 1
    max: 30
    step: 1
    initial: 1
    mode: box
    icon: mdi:snowflake

  # Пока до цели гостиной больше этого значения, livingroom_heat_cycle_cap
  # не ставит 12-минутный предел. initial только при создании сущности.
  livingroom_overheat_delta:
    name: Дельта защиты от перетопа
    min: 0.3
    max: 2.5
    step: 0.1
    initial: 0.9
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-alert

timer:
  bedroom_presence_off_delay:
    duration: "00:15:00"
  # 12 минут только когда до цели гостиной осталось не больше
  # input_number.livingroom_overheat_delta. Пока холоднее, таймер не запускается.
  livingroom_heat_cycle_cap:
    name: Предел топки гостиной у цели
    duration: "00:12:00"

template:

  # Считается по таймеру и по смене источника. Обычный шаблон тут не
  # просыпается: зависший датчик больше не меняет состояние, и термостат
  # так и остаётся на старом числе.
  - triggers:
      - trigger: state
        entity_id:
          - input_select.heating_temp_source
          - sensor.livingroom_sensor_temperature
          - sensor.bedroom_sensor_temperature
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - unique_id: heating_control_temperature
        default_entity_id: sensor.heating_control_temperature
        name: Температура для отопления
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >
          {% set source = states('input_select.heating_temp_source') %}
          {% if source == 'bedroom' %}
            {{ is_number(states('sensor.bedroom_sensor_temperature')) }}
          {% elif source == 'livingroom' %}
            {{ is_number(states('sensor.livingroom_sensor_temperature')) }}
          {% else %}
            false
          {% endif %}
        state: >
          {% set source = states('input_select.heating_temp_source') %}
          {% if source == 'bedroom' %}
            {{ states('sensor.bedroom_sensor_temperature') }}
          {% else %}
            {{ states('sensor.livingroom_sensor_temperature') }}
          {% endif %}
        attributes:
          source: "{{ states('input_select.heating_temp_source') }}"

  - switch:
      - name: domofon_door_rest
        unique_id: domofon_door_rest
        icon: mdi:gate-open
        state: "{{ false }}"
        turn_on:
          - service: rest_command.domofon_open_door

      - name: "Virtual Heating Relay"
        unique_id: virtual_heating_relay
        icon: mdi:fire
        state: "{{ is_state('input_boolean.heating_relay_virtual', 'on') }}"
        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.heating_relay_virtual
        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.heating_relay_virtual

  - binary_sensor:
      - name: Bedroom Presence Virtual
        unique_id: bedroom_presence_virtual
        device_class: occupancy
        state: "{{ is_state('input_boolean.bedroom_presence_state', 'on') }}"

  - sensor:

      - name: "Gas Boiler Required Mode"
        unique_id: gas_boiler_required_mode
        state: >
          {% set zone_thermostats = [
            'climate.livingroom_thermostat'
          ] %}
          {% set demanding = zone_thermostats
              | select('is_state', 'heat')
              | select('is_state_attr', 'hvac_action', 'heating')
              | list %}
          {{ 'heat' if demanding | count > 0 else 'off' }}
          
      - name: "Energy Total"
        unique_id: "energy_total"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set raw = states('sensor.energy_relay_energy') %}
          {% set val = raw | float(default=None) %}
          {% set prev = this.state | float(0) %}

          {% if val is not none and val >= 0 %}
            {% set new = (val + 19360.7) %}
            {{ [new, prev] | max | round(1) }}
          {% else %}
            {{ prev }}
          {% endif %}

      - name: "Atmospheric Pressure mmHg"
        unique_id: pressure_mmhg_avg
        unit_of_measurement: "mmHg"
        device_class: pressure
        state_class: measurement
        state: >
          {% set v1 = states('sensor.yard_sensor_pressure') | float(default=none) %}
          {% set v2 = states('sensor.podval_sensor_pressure') | float(default=none) %}
    
          {% if v1 == 0 %}
            {% set v1 = none %}
          {% endif %}
      
          {% if v2 == 0 %}
            {% set v2 = none %}
          {% endif %}
    
          {% if v1 is not none and v2 is not none %}
            {{ (((v1 + v2) / 2) * 0.750062 + 7) | round(1) }}
          {% elif v1 is not none %}
            {{ (v1 * 0.750062 + 7) | round(1) }}
          {% elif v2 is not none %}
            {{ (v2 * 0.750062 + 7) | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}         

      - name: "Livingroom Thermostat Target"
        unique_id: livingroom_thermostat_target
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.livingroom_thermostat', 'temperature') }}"

      - name: "next_sunrise"
        state: >
          {{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M') }}
        unique_id: "next_sunrise"

      - name: "next_sunset"
        state: >
          {{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M') }}
        unique_id: "next_sunset"


  # ================================================================
  # ПОГОДА
  # ================================================================

  - triggers:

      # Обновлять прогноз раз в час
      - trigger: time_pattern
        hours: "/1"

      # Получить прогноз сразу после запуска HA
      - trigger: homeassistant
        event: start

    actions:

      # Посуточный прогноз
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_house_lenina
        data:
          type: daily
        response_variable: daily_forecast

      # Почасовой прогноз
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_house_lenina
        data:
          type: hourly
        response_variable: hourly_forecast

    sensor:

      - name: "OpenHASP Weather Daily"
        unique_id: openhasp_weather_daily

        state: "{{ now().isoformat() }}"

        attributes:

          # ========================================================
          # ИСХОДНЫЙ ПОСУТОЧНЫЙ ПРОГНОЗ
          # ========================================================

          forecast: >
            {{ daily_forecast["weather.forecast_house_lenina"]["forecast"] }}


          # ========================================================
          # ДАННЫЕ ДЛЯ ПОСУТОЧНОГО ПРОГНОЗА OPENHASP
          # ========================================================

          weather_display: >

            {% import 'weather_helpers.jinja' as wx %}

            {% set result = namespace(items=[]) %}

            {% for item in daily_forecast["weather.forecast_house_lenina"]["forecast"][:6] %}

              {% set dt = as_datetime(item.datetime) %}
              {% set bearing = item.wind_bearing | float(0) %}
              {% set direction = wx.wind_dir(bearing) %}

              {% set result.items = result.items + [{
                'date': wx.day_name(dt.weekday()) ~ ' ' ~ dt.strftime('%d.%m'),
                'temperature': item.temperature | round(1),
                'templow': item.templow | round(1),
                'condition': item.condition,
                'icon': wx.icon(item.condition),
                'color': wx.color(item.condition),
                'precipitation': item.precipitation | float(0) | round(1),
                'wind_bearing': bearing | round(1),
                'wind_direction': direction,
                'wind_speed': item.wind_speed | float(0) | round(1)
              }] %}

            {% endfor %}

            {{ result.items }}


          # ========================================================
          # ДЕТАЛЬНЫЙ ПОЧАСОВОЙ ПРОГНОЗ
          #
          # 24 часа разбиваются на 12 двухчасовых интервалов:
          #
          # [0]  +0h  = часы 0 + 1
          # [1]  +2h  = часы 2 + 3
          # [2]  +4h  = часы 4 + 5
          # ...
          # [11] +22h = часы 22 + 23
          #
          # precipitation  — сумма за 2 часа
          # wind_speed     — средняя скорость
          # wind_direction — направление часа с большей скоростью
          # temperature    — средняя температура
          # ========================================================

          weather_hourly_display: >

            {% import 'weather_helpers.jinja' as wx %}

            {% set forecast =
              hourly_forecast["weather.forecast_house_lenina"]["forecast"]
            %}

            {% set result = namespace(items=[]) %}

            {% for i in range(12) %}

              {% set a = forecast[i * 2] %}
              {% set b = forecast[i * 2 + 1] %}

              {% set speed_a = a.wind_speed | float(0) %}
              {% set speed_b = b.wind_speed | float(0) %}

              {% set selected = a if speed_a >= speed_b else b %}
              {% set bearing = selected.wind_bearing | float(0) %}
              {% set condition = selected.condition %}
              {% set direction = wx.wind_dir(bearing) %}

              {% set result.items = result.items + [{
                'time': '+' ~ (i * 2) ~ 'h',

                'precipitation': (
                  (a.precipitation | float(0)) +
                  (b.precipitation | float(0))
                ) | round(1),

                'wind_speed': (
                  (speed_a + speed_b) / 2
                ) | round(1),

                'wind_direction': direction,

                'temperature': (
                  (
                    (a.temperature | float(0)) +
                    (b.temperature | float(0))
                  ) / 2
                ) | round(1),

                'condition': condition,
                'icon': wx.icon(condition),
                'color': wx.color(condition)
              }] %}

            {% endfor %}

            {{ result.items }}


mqtt:
  sensor:

    - name: "Water Consumption Cubic Meters"
      state_topic: "zigbee2mqtt_poe/impulse_counter"
      value_template: "{{ ((value_json.l3 | int * 10 / 1000) + 21.925) | round(2) }}"
      unit_of_measurement: "m³"
      device_class: "water"


utility_meter:

  daily_energy_main:
    source: sensor.energy_relay_energy
    cycle: daily

  daily_energy_boiler:
    source: sensor.boiler_relay_energy
    cycle: daily

  daily_water:
    source: sensor.water_consumption_cubic_meters
    cycle: daily


tts:
  - platform: google_translate


# Telegram: интеграция telegram_bot. Текст — notify.send_message,
# фото и видео — telegram_bot.send_photo / send_video.
# Цель — !secret telegram_notify_entity (групповой чат).
# Платформа notify с platform: telegram удалена в HA 2026.11.


lovelace:
  resource_mode: yaml

  resources:
    - url: /local/community/button-card/button-card.js
      type: module

    - url: /local/community/webrtc-camera/webrtc-camera.js
      type: module

  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true


sensor:

  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'

  - platform: statistics
    name: Yard temperature min 24h
    entity_id: sensor.yard_sensor_temperature
    state_characteristic: value_min
    sampling_size: 500
    max_age:
      hours: 24

  - platform: statistics
    name: Yard temperature max 24h
    entity_id: sensor.yard_sensor_temperature
    state_characteristic: value_max
    sampling_size: 500
    max_age:
      hours: 24

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml