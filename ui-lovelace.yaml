- title: Погода
  id: main
  icon: mdi:weather-partly-cloudy
  cards:
    - type: vertical-stack
      cards:
        - type: weather-forecast
          entity: weather.forecast_house_lenina
          show_forecast: true
          name: Шадринск

        - type: entities
          show_header_toggle: false
          entities:
            - entity: sensor.yard_sensor_temperature
              name: Температура
            - entity: sensor.yard_temperature_min_24h
              name: Минимум за сутки
              icon: mdi:thermometer-minus
            - entity: sensor.yard_temperature_max_24h
              name: Максимум за сутки
              icon: mdi:thermometer-plus
            - entity: sensor.yard_sensor_humidity
              name: Влажность
          title: Двор

        - type: entities
          show_header_toggle: false
          entities:
            - entity: sensor.next_sunrise
              name: Следующий рассвет
              icon: mdi:weather-sunset-up
            - entity: sensor.next_sunset
              name: Следующий закат
              icon: mdi:weather-sunset-down
          title: Солнце

        - type: history-graph
          title: "Атмосферное давление за последние 96 часов"
          hours_to_show: 96
          entities:
            - entity: sensor.atmospheric_pressure_mmhg
              name: "Давление (сред.)"

        - type: history-graph
          title: "Температура в доме за последние 96 часов"
          hours_to_show: 96
          entities:
            - entity: sensor.bedroom_sensor_temperature
              name: "Спальня"
              color: blue
            - entity: sensor.livingroom_sensor_temperature
              name: "Гостиная"
              color: yellow
            - entity: sensor.livingroom_thermostat_target
              name: "Целевая"
              color: red

        - type: history-graph
          title: "Влажность в доме за последние 96 часов"
          hours_to_show: 96
          entities:
            - sensor.bedroom_sensor_humidity
            - entity: sensor.bedroom_sensor_humidity
              name: Спальня
            - sensor.livingroom_sensor_humidity
            - entity: sensor.livingroom_sensor_humidity
              name: Гостиная

        - type: history-graph
          title: "Температура вне дома за последние 96 часов"
          hours_to_show: 96
          entities:
            - sensor.podval_sensor_temperature
            - entity: sensor.podval_sensor_temperature
              name: Подвал
            - sensor.yard_sensor_temperature
            - entity: sensor.yard_sensor_temperature
              name: Двор
            - sensor.pogreb_sensor_temperature
            - entity: sensor.pogreb_sensor_temperature
              name: Погреб

- title: Учет ресурсов
  id: counters
  icon: mdi:counter
  cards:
    - type: vertical-stack
      cards:
        - type: entities
          show_header_toggle: false     
          entities:
            - entity: sensor.daily_energy_main
              name: Потреблено энергии с начала суток
              icon: mdi:lightning-bolt  
            - entity: sensor.energy_total
              name: Показания счетчика на вводе в дом
              icon: mdi:counter                
            - entity: sensor.daily_water
              name: Израсходовано воды с начала суток
              icon: mdi:water-pump  
            - entity: sensor.water_consumption_cubic_meters
              name: Показания водомера на вводе в дом
              icon: mdi:counter 
          title: Потребление ресурсов

        - type: history-graph  
          title: "Энергопотребление в доме за 4 суток"
          hours_to_show: 96
          entities:
            - sensor.daily_energy_main

        - type: history-graph  
          title: "Потребление воды в доме за 4 суток"
          hours_to_show: 96
          entities:
            - sensor.daily_water

        - type: history-graph  
          title: "Напряжение в доме за 96 часов"
          hours_to_show: 96
          entities:
            - sensor.energy_relay_voltage

        - type: history-graph  
          title: "Энергопотребление дома за последние сутки"
          hours_to_show: 24
          entities:
            - entity: sensor.energy_relay_power
              name: Дом 
            - entity: sensor.boiler_plug_power
              name: Водонагреватель  
            - entity: sensor.freezer_plug_power
              name: Холодильник  
            - entity: sensor.boiler_relay_power
              name: "Электрокотел"

- title: Отопление
  id: gas
  icon: mdi:gas-burner
  cards:
    - type: vertical-stack
      cards:

        # Управление — то, чем ты реально рулишь отоплением
        - type: entities
          show_header_toggle: false
          title: Газовый котел — управление
          entities:
            - entity: climate.livingroom_thermostat
              name: Термостат гостиной
            - entity: input_boolean.climate_daily
              name: Режимы термостата по расписанию
            - entity: climate.boiler_kotel
              name: Отопление
            - entity: climate.boiler_goriachaia_voda
              name: Горячая вода

        # Диагностика — здоровье связи и самого контроллера
        - type: entities
          show_header_toggle: false
          title: Газовый котел — диагностика
          entities:
            - entity: binary_sensor.gas_ping
              name: Связь с контроллером
            - entity: switch.gas_usb
              name: Питание контроллера
            - entity: sensor.boiler_oshibki
              name: Код ошибки
            - entity: binary_sensor.boiler_gorelka
              name: Горелка
            - entity: sensor.gas_boiler_required_mode
              name: Требуемый режим (расчёт)

        # Репортинг — что мы передаём в контроллер и откуда берём
        - type: entities
          show_header_toggle: false
          title: Газовый котел — датчики
          entities:
            - entity: sensor.yard_sensor_temperature
              name: Улица (датчик)
              icon: mdi:thermometer
            - entity: number.boiler_t_outdoor
              name: Улица (передано в контроллер)
              icon: mdi:sun-thermometer-outline
            - entity: number.boiler_t_indoor
              name: В доме (передано в контроллер)
              icon: mdi:home-thermometer-outline

        - type: history-graph
          title: "Температура теплоносителя"
          hours_to_show: 1
          entities:
            - sensor.boiler_temperatura_teplonositelia

        - type: history-graph
          title: "Модуляция котла"
          hours_to_show: 1
          entities:
            - sensor.boiler_moduliatsiia

        # Добавлены climate.boiler_kotel и sensor.gas_boiler_required_mode —
        # теперь видно всю цепочку решений одним взглядом:
        # расчётный режим → фактический режим котла → горелка → тепловой контур
        - type: history-graph
          title: Состояние сенсоров (за последний час)
          hours_to_show: 1
          refresh_interval: 60
          entities:
            - entity: sensor.gas_boiler_required_mode
              name: Требуемый режим
            - entity: climate.boiler_kotel
              name: Режим котла
            - entity: binary_sensor.boiler_gorelka
              name: Горелка
            - entity: binary_sensor.boiler_otoplenie
              name: Отопление вкл.
            - entity: switch.virtual_heating_relay
              name: Виртуальное реле

        - type: history-graph
          title: Тактование горелки по часам
          hours_to_show: 24
          entities:
            - entity: input_number.boiler_starts_last_hour

        - type: history-graph
          title: "Температура по комнатам и виртуальное реле"
          hours_to_show: 12
          entities:
            - entity: sensor.bedroom_sensor_temperature
              name: "Спальня"
              color: blue
            - entity: sensor.livingroom_sensor_temperature
              name: "Гостиная"
              color: yellow
            - entity: sensor.livingroom_thermostat_target
              name: "Целевая"
              color: red
            - entity: switch.virtual_heating_relay