- id: soil_moisture_check
  alias: Влага почвы — напоминание при понижении
  trigger:
    - platform: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
      for: 00:00:10
    - platform: time
      at: '10:00:00'
  condition:
    - condition: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
  action:
    - service: notify.send_message
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: "Проверьте влажность почвы у цветов в доме\n \U0001F331 Влажность ниже
          100%.\n \n"

- id: gate_open
  alias: Домофон — калитка открыта
  mode: single
  trigger:
    - platform: event
      event_type: call_service
  condition:
    - condition: template
      value_template: >
        {{ trigger.event.data.domain == 'rest_command'
           and trigger.event.data.service == 'domofon_open_door' }}
  action:
    - parallel:
        - sequence:
            - service: media_player.play_media
              continue_on_error: true
              target:
                entity_id: !secret yandex_station_livingroom
              data:
                media_content_id: Замок калитки открыт
                media_content_type: text
                extra:
                  volume_level: 0.7
        - sequence:
            - service: camera.snapshot
              continue_on_error: true
              data:
                entity_id: camera.domofon_audio
                filename: /config/www/domofon.jpg
            - service: shell_command.record_domofon_video
              continue_on_error: true
        - sequence:
            - delay: "00:00:02"
            - service: rest_command.domofon_reject_call
              continue_on_error: true
    # Параллельная ветка дождалась конца записи. Дальше копия со штампом
    # и отдельный скрипт: он повторяет отправку и не держит эту автоматизацию.
    - variables:
        stamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
        clip_photo: "/config/www/domofon_{{ stamp }}.jpg"
        clip_video: "/config/www/domofon_{{ stamp }}.mp4"
    - service: shell_command.save_domofon_clip
      continue_on_error: true
      data:
        photo: "{{ clip_photo }}"
        video: "{{ clip_video }}"
    - service: script.turn_on
      data:
        entity_id: script.send_domofon_media
        variables:
          photo: "{{ clip_photo }}"
          video: "{{ clip_video }}"
          notify_on_fail: true

- id: domofon_media_retry
  alias: Домофон — дослать неотправленный клип
  description: >
    Подбирает кадр, который не ушёл с первой серии попыток или остался после
    перезапуска HA. Пока скрипт уже отправляет, второй проход не запускается.
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/10"
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: script.send_domofon_media
      state: "off"
  action:
    - service: shell_command.prune_domofon_clips
      continue_on_error: true
    - service: shell_command.next_domofon_clip
      continue_on_error: true
      response_variable: pending
    - variables:
        lines: >-
          {{ (pending.stdout | default('')).strip().split('\n') }}
        photo: "{{ lines[0] | default('') | trim }}"
        video: "{{ lines[1] | default('') | trim }}"
    - condition: template
      value_template: >
        {{ photo is match('^/config/www/domofon_[0-9]{8}_[0-9]{6}\.jpg$') }}
    - service: script.turn_on
      data:
        entity_id: script.send_domofon_media
        variables:
          photo: "{{ photo }}"
          video: "{{ video }}"
          notify_on_fail: false

- id: total_info
  alias: Уведомление о потреблении ежесуточно
  trigger:
    - platform: time
      at: 00:01:00
  action:
    - service: notify.send_message
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: "Потреблено за сутки в доме:  \n⚡ Энергия: {{ state_attr('sensor.daily_energy_main',
          'last_period') | float }} кВт⋅ч  \n\U0001F4A7 Вода: {{ state_attr('sensor.daily_water',
          'last_period') | float }} м³\n"

- id: devices_offline_notification
  alias: Оповещение о потере связи с устройствами
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.domofon_ping
        - binary_sensor.videoreg_ping
        - binary_sensor.192_168_0_50
        - binary_sensor.openhasp_panel
      to: 'off'
      for: "00:02:00"
  condition:
    - condition: state
      entity_id: input_boolean.notify_offline
      state: 'on'
  action:
    - service: notify.send_message
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: >
          {% set devices = {
            'binary_sensor.domofon_ping': ['Домофон', '192.168.0.200'],
            'binary_sensor.videoreg_ping': ['Видеосервер', '192.168.0.150'],
            'binary_sensor.192_168_0_50': ['Zigbee-роутер', '192.168.0.50'],
            'binary_sensor.openhasp_panel': ['OpenHASP панель', '192.168.0.120']
          } %}
          ША: {{ devices[trigger.entity_id][0] }} ({{ devices[trigger.entity_id][1] }}) не в сети более 2 минут

- id: leaving_home
  alias: Хозяева покинули дом
  trigger:
    platform: state
    entity_id: group.family
    to: not_home
  action:
    # Устройства раньше Telegram: таймаут бота обрывает остальные шаги.
    - service: switch.turn_on
      continue_on_error: true
      data:
        entity_id: switch.ipcam_plug
    - service: switch.turn_off
      continue_on_error: true
      data:
        entity_id: switch.wled_plug
    - service: input_boolean.turn_on
      continue_on_error: true
      target:
        entity_id: input_boolean.notify_door
    - service: notify.send_message
      continue_on_error: true
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: 'ША: Все ушли, уведомления об открытии дверей включены'

- id: entering_home
  alias: Хозяин вернулся в дом
  trigger:
    platform: state
    entity_id: group.family
    from: not_home
    to: home
  action:
    # Камера и флаг двери раньше Telegram. 14.11.2026 бот ответил
    # Timed out через ~5 с, и switch.ipcam_plug остался включённым,
    # хотя group.family уже был home.
    - service: switch.turn_off
      continue_on_error: true
      data:
        entity_id: switch.ipcam_plug
    - service: switch.turn_on
      continue_on_error: true
      data:
        entity_id: switch.wled_plug
    - service: input_boolean.turn_off
      continue_on_error: true
      target:
        entity_id: input_boolean.notify_door
    - service: notify.send_message
      continue_on_error: true
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: 'ША: Кто-то из хозяев пришёл в дом, уведомления об открытии дверей отключены'

- id: ipcam_off_while_home
  alias: Камера кошки выключена, пока хозяева дома
  description: >
    Пока group.family = home, розетка камеры обязана быть выключена.
    Приход ловит entering_home, но только переход not_home → home.
    Если команда не дошла (Telegram оборвал сценарий, розетка была
    unavailable, HA перезапустился уже с кем-то дома), эта проверка
    дожимает выключение.
  mode: single
  trigger:
    - platform: state
      entity_id: group.family
      to: home
    - platform: state
      entity_id: switch.ipcam_plug
      to: "on"
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: group.family
      state: home
    - condition: state
      entity_id: switch.ipcam_plug
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.ipcam_plug

- id: door_open
  alias: Оповещение об открытии дверей дома
  mode: parallel
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.front_door_contact
        - binary_sensor.back_door_contact
      from: 'on'
      to: 'off'
  condition:
    - condition: state
      entity_id: input_boolean.notify_door
      state: 'on'
  variables:
    door_name: "{% if trigger.entity_id == 'binary_sensor.front_door_contact' %}\n
      \ парадной двери \U0001F513\n{% elif trigger.entity_id == 'binary_sensor.back_door_contact'
      %}\n  задней двери \U0001F513\n{% else %}\n  неизвестной двери\n{% endif %}"
  action:
    - service: notify.send_message
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: 'ША: Открытие {{ door_name }}'

- id: sun_set
  alias: Закат (использую для проверки, включен ли сервер)
  trigger:
    - platform: sun
      event: sunset
  action:
    - service: notify.send_message
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: |
          ША: Солнце село 🌅
          temp out {{ states('sensor.yard_sensor_temperature') | float(0) | round(1) }}°C / in {{ states('sensor.bedroom_sensor_temperature') | float(0) | round(1) }}°C
  mode: single

- id: leak_water_protection
  alias: Протечка — перекрытие воды и оповещение
  mode: single
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.leak_kitchen_water_leak
        - binary_sensor.leak_toilet_water_leak
      to: 'on'
  variables:
    leak_place: >
      {% if trigger.entity_id == 'binary_sensor.leak_kitchen_water_leak' %}
        кухне
      {% elif trigger.entity_id == 'binary_sensor.leak_toilet_water_leak' %}
        туалете
      {% else %}
        неизвестном месте
      {% endif %}
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.water_isolation_valve
    - service: notify.send_message
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: "🚨 ПРОТЕЧКА в {{ leak_place }}! Вода перекрыта."
    - service: media_player.play_media
      target:
        entity_id: !secret yandex_station_livingroom
      data:
        media_content_id: "Обнаружена протечка в {{ leak_place }}. Вода перекрыта."
        media_content_type: text
        extra:
          volume_level: 0.9

- id: domofon_ringing
  alias: Вызов на домофоне
  trigger:
    - platform: state
      entity_id: sensor.domofon_call_state
      to: ringing
  condition: []
  action:
    - variables:
        prev_page: "{{ states('number.plate1_page_number') | int(1) }}"
    - service: notify.send_message
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: "📞 Вызов на домофоне"
    - service: media_player.play_media
      target:
        entity_id: !secret yandex_station_livingroom
      data:
        media_content_id: "Вызов на домофоне"
        media_content_type: text
        extra:
          volume_level: 0.7
    - service: number.set_value
      target:
        entity_id: number.plate1_page_number
      data:
        value: 4
    - service: light.turn_on
      target:
        entity_id: light.plate1_backlight
      data:
        brightness_pct: 100
        
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/idle
        payload: "off"
        
    - delay: "00:01:00"
    - service: number.set_value
      target:
        entity_id: number.plate1_page_number
      data:
        value: "{{ prev_page }}"
    - service: light.turn_off
      target:
        entity_id: light.plate1_backlight
  mode: single