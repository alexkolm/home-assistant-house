- id: magicube_wled_brightness
  alias: Magic Cube — регулировка яркости WLED
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt_poe/magicube
      value_template: "{{ value_json.action }}"
      payload: "rotate_right"
      id: brightness_up

    - trigger: mqtt
      topic: zigbee2mqtt_poe/magicube
      value_template: "{{ value_json.action }}"
      payload: "rotate_left"
      id: brightness_down

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: brightness_up
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.wled
              data:
                brightness_step_pct: 10

        - conditions:
            - condition: trigger
              id: brightness_down
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.wled
              data:
                brightness_step_pct: -10

  mode: single
- id: magicube_toggle_wled
  alias: Magic Cube — переключение подсветки
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt_poe/magicube
      value_template: "{{ value_json.action }}"
      payload: "flip90"
  actions:
    - action: light.toggle
      target:
        entity_id: light.wled
  mode: single
- id: panel_weather_charts
  alias: Отображение графиков погоды
  triggers:
    - trigger: state
      entity_id: number.plate1_page_number
      to: '6'
    - trigger: state
      entity_id: light.plate1_backlight
      to: 'on'
  conditions:
    - condition: state
      entity_id: number.plate1_page_number
      state: '6'
  actions:
    - action: openhasp.push_image
      continue_on_error: true
      target:
        entity_id: openhasp.plate1
      data:
        obj: p6b1
        image: http://192.168.0.101/weather/temperature.jpg
        width: 470
        height: 200
    - action: openhasp.push_image
      continue_on_error: true
      target:
        entity_id: openhasp.plate1
      data:
        obj: p6b2
        image: http://192.168.0.101/weather/precipitation.jpg
        width: 470
        height: 200
  mode: single

- id: openhasp_weather_daily
  alias: Обновление посуточной погоды на панели plate1
  mode: restart
  trigger:
    - platform: state
      entity_id: sensor.openhasp_weather_daily
    - platform: mqtt
      topic: hasp/plate1/LWT
      payload: "online"
  action:
    - repeat:
        count: 5
        sequence:
          - variables:
              i: "{{ repeat.index }}"
              base: "{{ 31 + (repeat.index - 1) * 10 }}"
              item: >
                {{ state_attr(
                  'sensor.openhasp_weather_daily',
                  'weather_display'
                )[repeat.index] }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p2b{{ base }}.text"
              payload: >
                  {{ item.date | replace('\n', ' ') | regex_replace('\s+', ' ') | trim }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p2b{{ base + 1 }}.text"
              payload: >
                {{ item.temperature | float(0) | round(1) }}°
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p2b{{ base + 2 }}.text"
              payload: >
                {{ item.templow | float(0) | round(1) }}°
          - service: mqtt.publish
            data:
              topic: hasp/plate1/command/jsonl
              payload: >
                {{ {
                  'page': 2,
                  'id': base + 3,
                  'text': item.icon | trim,
                  'text_color': item.color | trim
                } | to_json }}

- id: openhasp_weather_hourly
  alias: Обновление почасовой погоды на панели plate1
  mode: restart
  trigger:
    - platform: state
      entity_id: sensor.openhasp_weather_daily
      attribute: weather_hourly_display
    - platform: mqtt
      topic: hasp/plate1/LWT
      payload: "online"
  action:
    - repeat:
        count: 12
        sequence:
          - variables:
              i: "{{ repeat.index - 1 }}"
              item: >
                {{ state_attr(
                  'sensor.openhasp_weather_daily',
                  'weather_hourly_display'
                )[repeat.index - 1] }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/jsonl"
              payload: >
                {{ {
                  'page': 5,
                  'id': 10 + i,
                  'text': item.icon | trim,
                  'text_color': item.color | trim
                } | to_json }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 30 + i }}.hidden"
              payload: >
                {{ '1' if item.precipitation | float(0) == 0 else '0' }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 50 + i }}.hidden"
              payload: >
                {{ '1' if item.precipitation | float(0) <= 1 else '0' }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 70 + i }}.text"
              payload: >
                {{ item.precipitation | float(0) | round(1) }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 91 + i }}.text"
              payload: >
                {{ item.temperature | float(0) | round(1) }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 110 + i }}.text"
              payload: >
                {{ item.wind_direction }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 130 + i }}.text"
              payload: >
                {{ item.wind_speed | float(0) | round(1) }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/jsonl"
              payload: >
                {% import 'weather_helpers.jinja' as wx %}
                {{ {
                  'page': 5,
                  'id': 150 + i,
                  'points': wx.wind_arrow(item.wind_direction | trim)
                } | to_json }}

- id: awtrix_right_button_wled
  alias: AWTRIX — правая кнопка — подсветка под кроватью
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.awtrix_1ed68c_button_right
      to: "on"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.wled_plug
              state: "off"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.wled_plug
            - delay:
                seconds: 3
            - service: rest_command.wled_preset_2
        - conditions:
            - condition: state
              entity_id: switch.wled_plug
              state: "on"
            - condition: state
              entity_id: light.wled
              state: "off"
          sequence:
            - service: rest_command.wled_preset_2
        - conditions:
            - condition: state
              entity_id: switch.wled_plug
              state: "on"
            - condition: state
              entity_id: light.wled
              state: "on"
          sequence:
            - service: rest_command.wled_preset_1

# Штатные Temperature и Humidity выключаются ключами TEMP/HUM.
# Прошивка применяет это только после перезагрузки часов.
# До неё на матрице будут и старые кадры, и новые.
# save: true пишем во flash только когда меняется раскладка, не на каждый градус.
# pos 5, 6 и 7: на этой прошивке 1 и 2 ставят свои кадры перед часами.
# Свой кадр не читает встроенный рисунок, только файл из /ICONS.
# thermo и drop — точные пиксели icon_234 и icon_2075 из прошивки.
# Капля сдвинута на ряд вниз, как это делает штатный экран влажности.
# Номера LaMetric 234 и 2075 сейчас другие картинки, их не качать.
# Улица остаётся со снежинкой 1983.
# Улица — целое число. Нет показания — прошлый кадр не затираем нулём.
# Этот кадр пишем во flash и при смене целого градуса: иначе он только в памяти
# и пропадает, если часы выключить до следующей перезаписи раскладки.
- id: awtrix_display_loop
  alias: AWTRIX — длительность экранов
  mode: queued
  max: 5
  trigger:
    - platform: homeassistant
      event: start
      id: full
    - platform: state
      entity_id: input_number.awtrix_time_seconds
      id: settings
    - platform: state
      entity_id:
        - input_number.awtrix_temp_seconds
        - input_number.awtrix_hum_seconds
        - input_number.awtrix_yard_seconds
      id: duration
    - platform: state
      entity_id:
        - sensor.awtrix_1ed68c_temperature
        - sensor.awtrix_1ed68c_humidity
      id: reading
    # Целое число, чтобы десятые доли уличного датчика не переписывали кадр.
    - platform: template
      id: reading
      value_template: >
        {% if is_number(states('sensor.yard_sensor_temperature')) %}
          {{ states('sensor.yard_sensor_temperature') | float | round(0) | int }}
        {% else %}
          none
        {% endif %}
    - platform: state
      entity_id: sensor.awtrix_1ed68c_ip_address
      from:
        - unavailable
        - unknown
      id: full
  action:
    - if:
        - condition: trigger
          id: full
      then:
        - delay:
            seconds: 15
    - condition: template
      value_template: >
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {{ states('sensor.awtrix_1ed68c_temperature') not in bad
           and states('sensor.awtrix_1ed68c_humidity') not in bad
           and states('input_number.awtrix_time_seconds') not in bad
           and states('input_number.awtrix_temp_seconds') not in bad
           and states('input_number.awtrix_hum_seconds') not in bad
           and states('input_number.awtrix_yard_seconds') not in bad }}
    - variables:
        save_app: "{{ trigger.id in ['full', 'settings', 'duration'] }}"
        temp_text: "{{ states('sensor.awtrix_1ed68c_temperature') | float(0) | round(0) | int }}°"
        hum_text: "{{ states('sensor.awtrix_1ed68c_humidity') | float(0) | round(0) | int }}%"
    - if:
        - condition: template
          value_template: "{{ trigger.id in ['full', 'settings'] }}"
      then:
        - service: mqtt.publish
          data:
            topic: awtrix/settings
            payload: >
              {{ {
                'ATIME': states('input_number.awtrix_time_seconds') | int(4),
                'TEMP': false,
                'HUM': false
              } | to_json }}
    - service: mqtt.publish
      data:
        topic: awtrix/custom/temp
        payload: >
          {{ {
            'text': temp_text,
            'icon': 'thermo',
            'duration': states('input_number.awtrix_temp_seconds') | int(1),
            'center': true,
            'textCase': 2,
            'lifetime': 0,
            'save': save_app | bool,
            'pos': 5
          } | to_json }}
    - service: mqtt.publish
      data:
        topic: awtrix/custom/hum
        payload: >
          {{ {
            'text': hum_text,
            'icon': 'drop',
            'duration': states('input_number.awtrix_hum_seconds') | int(1),
            'center': true,
            'textCase': 2,
            'lifetime': 0,
            'save': save_app | bool,
            'pos': 6
          } | to_json }}
    - if:
        - condition: template
          value_template: "{{ is_number(states('sensor.yard_sensor_temperature')) }}"
      then:
        - service: mqtt.publish
          data:
            topic: awtrix/custom/yard
            payload: >
              {{ {
                'text': (states('sensor.yard_sensor_temperature') | float | round(0) | int) ~ '°',
                'icon': '1983',
                'duration': states('input_number.awtrix_yard_seconds') | int(1),
                'center': true,
                'textCase': 2,
                'lifetime': 0,
                'save': true,
                'pos': 7
              } | to_json }}

- id: button_door_open
  alias: Домофон — открыть с кнопки (Zigbee)
  mode: single
  trigger:
    - platform: mqtt
      topic: "zigbee2mqtt_poe/button_door/action"
      payload: "single"
  condition: []
  action:
    - parallel:
        - sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.domofon_door_rest
        - sequence:
            - service: media_player.play_media
              continue_on_error: true
              target:
                entity_id: !secret yandex_station_livingroom
              data:
                media_content_id: Кнопка нажата
                media_content_type: text
                extra:
                  volume_level: 0.7

- id: bedroom_presence_detected
  alias: Спальня - обнаружено присутствие
  trigger:
    - platform: state
      entity_id: binary_sensor.human_sensor_bedroom_presence
      to: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.bedroom_presence_state
    - service: timer.cancel
      target:
        entity_id: timer.bedroom_presence_off_delay
  mode: restart

- id: bedroom_presence_lost
  alias: Спальня - датчик потерял присутствие
  trigger:
    - platform: state
      entity_id: binary_sensor.human_sensor_bedroom_presence
      to: "off"
  action:
    - service: timer.start
      target:
        entity_id: timer.bedroom_presence_off_delay
  mode: restart

- id: bedroom_presence_timeout
  alias: Спальня - виртуальное присутствие выключено по таймеру
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.bedroom_presence_off_delay
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.bedroom_presence_state
  mode: single

- id: away_script
  alias: Скрипт "Уезжаем надолго"
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: /away
  condition: []
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.notify_away_home
  mode: single

- id: faraway
  alias: Включение режима, когда уезжаем из дома надолго
  trigger:
    - platform: state
      entity_id: input_boolean.notify_away_home
      to: "on"
  condition: []
  action:
    - service: media_player.play_media
      continue_on_error: true
      target:
        entity_id: !secret yandex_station_livingroom
      data:
        media_content_id: Уезжаем надолго
        media_content_type: text
        extra:
          volume_level: 0.7
    - service: notify.send_message
      continue_on_error: true
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: "Скрипт 'Уехали надолго' запущен"
    - service: switch.turn_off
      target:
        entity_id: switch.boiler_plug
    - service: switch.turn_off
      target:
        entity_id:
          - switch.main_floor_relay
          - switch.towel_dryer_plug
    - delay: "00:00:05"
    - service: switch.turn_on
      target:
        entity_id:
          - switch.main_floor_relay
          - switch.towel_dryer_plug
    - choose:
        - conditions:
            - condition: state
              entity_id: climate.livingroom_thermostat
              state: "heat"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.climate_daily
            - service: climate.set_preset_mode
              continue_on_error: true
              target:
                entity_id: climate.livingroom_thermostat
              data:
                preset_mode: "away"
  mode: single

- id: heat_before_return
  alias: Команда /heat — прогреть дом к приезду
  description: >
    Обратная команда к /away, за пару часов до возвращения.
    Сначала снимается «Уехали надолго» и включаются водонагреватель
    и суточный график. Комфорт ставится после паузы: при включении
    графика расписание сна может успеть записать свой пресет, и без
    паузы оно затрёт комфорт. heat включается явно, иначе один пресет
    дом не греет.
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: /heat
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.notify_away_home
    - service: switch.turn_on
      target:
        entity_id: switch.boiler_plug
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.climate_daily
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.livingroom_thermostat
      data:
        hvac_mode: heat
    - delay: "00:00:02"
    - service: climate.set_preset_mode
      target:
        entity_id: climate.livingroom_thermostat
      data:
        preset_mode: comfort
    - service: notify.send_message
      continue_on_error: true
      target:
        entity_id: !secret telegram_notify_entity
      data:
        message: "Скрипт 'Греем дом' запущен: комфорт, расписание, водонагреватель."
  mode: single

- id: notify_offline_restore_after_48h
  alias: Restore notify_offline after 48h
  mode: restart
  trigger:
    - platform: state
      entity_id: input_boolean.notify_offline
      to: "off"
  action:
    - delay: "48:00:00"
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.notify_offline

- id: bathroom_presence_fan_control
  alias: "Управление вытяжкой по датчику присутствия"
  trigger:
    - platform: state
      entity_id: binary_sensor.human_sensor_bathroom_presence
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.human_sensor_bathroom_presence
              state: 'on'
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.airvent_relay
        - conditions:
            - condition: state
              entity_id: binary_sensor.human_sensor_bathroom_presence
              state: 'off'
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.airvent_relay
  mode: single

- id: house_devices_off
  alias: "Контроль освещения — выключить после 5 часов работы"
  trigger:
    - platform: time_pattern
      minutes: "/30"
  condition: []
  action:
    - if:
        - condition: state
          entity_id: switch.livingroom_relay
          state: "on"
        - condition: template
          value_template: >
            {{ (as_timestamp(now()) - as_timestamp(states.switch.livingroom_relay.last_changed)) > 5 * 3600 }}
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.livingroom_relay
        - service: notify.send_message
          target:
            entity_id: !secret telegram_notify_entity
          data:
            message: |
              ⚠️ Реле в гостиной работало более 5 часов.
              Автоматически отключено.
    - if:
        - condition: state
          entity_id: light.torsher_lamp
          state: "on"
        - condition: template
          value_template: >
            {{ (as_timestamp(now()) - as_timestamp(states.light.torsher_lamp.last_changed)) > 5 * 3600 }}
      then:
        - service: light.turn_off
          target:
            entity_id: light.torsher_lamp
        - service: notify.send_message
          target:
            entity_id: !secret telegram_notify_entity
          data:
            message: |
              ⚠️ Торшер горел более 5 часов.
              Автоматически отключен.
  mode: parallel
  max: 3

- id: panel_cam_snapshot
  alias: Отображение кадра с домофона
  triggers:
    - seconds: /2
      trigger: time_pattern
  conditions:
    - condition: state
      entity_id: light.plate1_backlight
      state: 'on'
    - condition: state
      entity_id: number.plate1_page_number
      state: '4'
  actions:
    - action: openhasp.push_image
      continue_on_error: true
      target:
        entity_id: openhasp.plate1
      data:
        obj: p4b1
        image: http://192.168.0.101/snapshot.jpg
        width: 480
        height: 270
  mode: restart

- id: munute_tact
  alias: Ежеминутная автоматизация (отображение на панели)
  trigger:
    - platform: time_pattern
      minutes: /1
  action:
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p0b1.text
        payload: '{{ now().strftime("%H:%M") }}'
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p2b3.text
        payload: >
          {% if states("sensor.next_sunrise") not in ['unavailable', 'unknown'] %}
            Восход: {{ states("sensor.next_sunrise") }}
          {% else %}
            Восход: Н/Д
          {% endif %}
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p2b4.text
        payload: >
          {% if states("sensor.next_sunset") not in ['unavailable', 'unknown'] %}
            Закат: {{ states("sensor.next_sunset") }}
          {% else %}
            Закат: Н/Д
          {% endif %}
    - variables:
        preset: "{{ state_attr('climate.livingroom_thermostat', 'preset_mode') | default('none') }}"
        ru_preset_map:
          none: "нет"
          comfort: "комфорт"
          away: "уехали"
          sleep: "сон"
        ru_preset: "{{ ru_preset_map[preset] if preset in ru_preset_map else 'Нет' }}"
        options: ["нет","комфорт","уехали","сон"]
        val: "{{ options.index(ru_preset) if ru_preset in options else 0 }}"
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p3b8.val
        payload: "{{ val }}"

- id: panel_page
  alias: Отображение страницы на панели
  trigger:
    - platform: mqtt
      topic: hasp/plate1/state/page
  action:
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p0b2.text
        payload: 'Стр: {{ trigger.payload }}'

