# =====================================================================
# Управление газовым котлом (Wertrus ECO-24FF + SmartTherm) и
# термостатом гостиной. Полная цепочка: репортинг температур в
# контроллер → расчёт требуемого режима → синхронизация с котлом →
# watchdog связи → пресеты по расписанию сна → диагностика/алерты.
# Сырой журнал котла — /config/boiler_link.jsonl (boiler_link_*).
# В Telegram из него ничего не собирается: туда идут только реальные
# ошибки контроллера и долгая потеря ping.
# Термостат гостиной живёт в UI (generic_thermostat), не в этом файле.
# Потолок длины топки в нём снят. Пока цель выше комнаты больше чем на
# 1,2 °C, вызов не режется: это выход из сна и из режима «уехали».
# Когда дельта становится 1,2 °C или меньше, livingroom_heat_cycle_cap
# выключает реле через 12 минут. Дальше термостат ждёт новое показание
# и не включается раньше чем через 5 минут. Допуски 0.1/0.
# Сообщения о включении котла не менялись.
# =====================================================================

- id: gas_boiler_maxtemp_enforce_on_reconnect
  alias: Установка лимита макс. температуры котла после (пере)подключения
  description: >
    Прошивка SmartTherm при каждом старте инициализирует MaxTSet
    (OpenTherm ID57, макс. температура теплоносителя) значением по
    умолчанию 80°C — это жёстко зашито в прошивке и не сохраняется в
    конфиге контроллера, поэтому переживает только перезапуск, а не
    хранится постоянно. Возвращаем свой фиксированный потолок 65°C
    сразу после восстановления связи.
  triggers:
    - trigger: state
      entity_id: binary_sensor.gas_ping
      to: 'on'
  actions:
    - delay:
        seconds: 5
    - action: climate.set_temperature
      target:
        entity_id: climate.boiler_kotel
      data:
        temperature: 65
    - action: logbook.log
      data:
        name: "Котёл"
        message: "Лимит макс. температуры 65°C установлен после (пере)подключения контроллера"
        entity_id: climate.boiler_kotel
  mode: single

- id: boiler_temp_limit
  alias: Ограничение температуры котла (фиксированный потолок 65°C)
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: climate.boiler_kotel
      attribute: temperature
      above: 65
  action:
    - service: climate.set_temperature
      target:
        entity_id: climate.boiler_kotel
      data:
        temperature: 65
    - service: logbook.log
      data:
        name: "Котёл"
        message: "Автоматизация ограничила температуру до 65°C"
        entity_id: climate.boiler_kotel
    - service: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('setpoint_cap', none, trigger.from_state.attributes.temperature | default(none), 65, 'climate.boiler_kotel') | base64_encode | replace('\\n', '') }}"

- id: gas_boiler_watchdog
  alias: Watchdog для газового котла
  description: >
    При потере связи с SmartTherm на 5 минут проверяем, не легла ли
    сеть целиком. Если сеть жива — до 3 раз перезапускаем питание
    контроллера с проверкой результата после каждой попытки.
  trigger:
    - platform: state
      entity_id: binary_sensor.gas_ping
      to: 'off'
      for: '00:05:00'
  condition: []
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.192_168_0_185
              state: 'off'
          sequence:
            - service: logbook.log
              data:
                name: "Watchdog котла"
                message: "Рестарт пропущен: похоже, недоступна вся сеть, а не контроллер"
            - service: notify.me
              data:
                message: >
                  ⚠️ Связь с котлом (SmartTherm, 192.168.0.212) потеряна,
                  но заодно недоступны и часы Awtrix — похоже, легла
                  вся сеть. Перезапуск контроллера не выполняю, проверь
                  роутер/Wi-Fi.
      default:
        - repeat:
            count: 3
            sequence:
              - service: logbook.log
                data:
                  name: "Watchdog котла"
                  message: "Попытка перезапуска питания №{{ repeat.index }}"
              - service: switch.turn_off
                target:
                  entity_id: switch.gas_usb
              - delay:
                  seconds: 10
              - service: switch.turn_on
                target:
                  entity_id: switch.gas_usb
              - delay:
                  seconds: 90
              - if:
                  - condition: state
                    entity_id: binary_sensor.gas_ping
                    state: 'on'
                then:
                  - service: notify.me
                    data:
                      message: >
                        ✅ Контроллер газового котла снова на связи после
                        перезапуска (попытка {{ repeat.index }} из 3).
                  - stop: "Связь восстановлена, дальнейшие попытки не нужны"
        - service: notify.me
          data:
            message: >
              🔴 3 попытки перезапустить контроллер газового котла
              (SmartTherm, 192.168.0.212) не помогли. Автоматика больше
              не долбит реле — нужна ручная проверка.
        - service: logbook.log
          data:
            name: "Watchdog котла"
            message: "Эскалация: 3 неудачные попытки перезапуска подряд"
  mode: single

- id: gas_boiler_recovered
  alias: Котел — связь восстановлена
  description: Уведомление, когда связь с SmartTherm вернулась после простоя
  trigger:
    - platform: state
      entity_id: binary_sensor.gas_ping
      from: 'off'
      to: 'on'
  condition:
    - condition: template
      value_template: >
        {{ (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) > 300 }}
  action:
    - service: notify.me
      data:
        message: >
          🟢 Связь с контроллером газового котла восстановлена.
          Отсутствовал {{ ((as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) / 60) | round(1) }} мин.
  mode: single

- id: gas_boiler_sync
  alias: Синхронизация газового котла с требуемым режимом
  description: >
    Единая точка управления climate.boiler_kotel. Реагирует и на изменение
    состояния термостатов зон (мгновенно), и по таймеру раз в 5 минут
    (страховка от рассинхрона, например после потери MQTT).
    При включении обнуляет счётчик тактов горелки за цикл. При выключении
    (комната достигла цели и термостат больше не требует нагрева) дописывает
    это число в уведомление.
  triggers:
    - trigger: state
      entity_id: climate.livingroom_thermostat
    - trigger: time_pattern
      minutes: /5
  variables:
    required_mode: "{{ states('sensor.gas_boiler_required_mode') }}"
    current_mode: "{{ states('climate.boiler_kotel') }}"
    burner_cycles: "{{ states('input_number.boiler_starts_current_cycle') | int(0) }}"
  conditions:
    - condition: template
      value_template: >
        {{ current_mode not in ['unavailable', 'unknown']
           and required_mode in ['heat', 'off'] }}
    - condition: template
      value_template: "{{ required_mode != current_mode }}"
  actions:
    - if:
        - condition: template
          value_template: "{{ required_mode == 'heat' }}"
      then:
        - action: input_number.set_value
          target:
            entity_id: input_number.boiler_starts_current_cycle
          data:
            value: 0
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.boiler_kotel
      data:
        hvac_mode: "{{ required_mode }}"
    - action: notify.me
      data:
        message: >
          🔥 Котёл {{ 'ВКЛЮЧЁН' if required_mode == 'heat' else 'ВЫКЛЮЧЕН' }}
          (было: {{ current_mode }})
          {% if required_mode == 'off' %}
          🔁 Тактов включения горелки: {{ burner_cycles }}
          {% endif %}
          🌡 Гостиная: {{ states('sensor.livingroom_sensor_temperature') | float(0) | round(1) }}°C,
          цель: {{ state_attr('climate.livingroom_thermostat', 'temperature') }}°C
          🕒 {{ now().strftime('%H:%M %d.%m.%Y') }}
  mode: single

- id: livingroom_preset_by_schedule
  alias: Термостат гостиной — пресет по расписанию сна
  description: >
    Переключает comfort/sleep по Schedule-хелперу schedule.night_mode.
    Реагирует на переход самого расписания и на включение
    input_boolean.climate_daily обратно после ручного оверрайда.
  triggers:
    - trigger: state
      entity_id: schedule.night_mode
    - trigger: state
      entity_id: input_boolean.climate_daily
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.climate_daily
      state: "on"
    - condition: not
      conditions:
        - condition: state
          entity_id: climate.livingroom_thermostat
          attribute: preset_mode
          state: "away"
  variables:
    desired_preset: "{{ 'sleep' if is_state('schedule.night_mode', 'on') else 'comfort' }}"
    current_preset: "{{ state_attr('climate.livingroom_thermostat', 'preset_mode') }}"
  actions:
    - if:
        - condition: template
          value_template: "{{ desired_preset != current_preset }}"
      then:
        - action: climate.set_preset_mode
          target:
            entity_id: climate.livingroom_thermostat
          data:
            preset_mode: "{{ desired_preset }}"
        - action: notify.me
          data:
            message: >
              🔄 Режим термостата автоматически изменён:
              {{ 'Комфорт' if desired_preset == 'comfort' else 'Сон' }}
              🌡 Температура гостиной: {{ states('sensor.livingroom_sensor_temperature') | float(0) | round(1) }}°C
              🕒 {{ now().strftime('%H:%M %d.%m.%Y') }}
  mode: single

- id: livingroom_heat_cycle_cap
  alias: Гостиная — предел топки у цели
  description: >
    Термостат длину топки не ограничивает. Пока цель выше текущей больше
    чем на 1,2 °C, таймер не ставится и вызов идёт до показания датчика.
    На включении реле или на первом показании, где дельта уже 1,2 °C или
    меньше, стартует timer.livingroom_heat_cycle_cap. Если температуру
    прочитать нельзя, предел ставится сразу, без длинного вызова вслепую.
  triggers:
    - trigger: state
      id: relay_on
      entity_id: switch.virtual_heating_relay
      to: "on"
    - trigger: state
      id: relay_off
      entity_id: switch.virtual_heating_relay
      to: "off"
    - trigger: state
      id: sensor
      entity_id: sensor.livingroom_sensor_temperature
      not_to:
        - unknown
        - unavailable
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: relay_off
            - condition: state
              entity_id: timer.livingroom_heat_cycle_cap
              state: active
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.livingroom_heat_cycle_cap
        - conditions:
            - condition: trigger
              id: relay_on
            - condition: template
              value_template: >
                {% set target = state_attr('climate.livingroom_thermostat', 'temperature') | float(none) %}
                {% set current = states('sensor.livingroom_sensor_temperature') | float(none) %}
                {{ target is not none and current is not none and (target - current) > 1.2 }}
          sequence:
            - if:
                - condition: state
                  entity_id: timer.livingroom_heat_cycle_cap
                  state: active
              then:
                - action: timer.cancel
                  target:
                    entity_id: timer.livingroom_heat_cycle_cap
            - action: logbook.log
              data:
                name: "Котёл"
                entity_id: switch.virtual_heating_relay
                message: >
                  Топка без предела: цель {{ state_attr('climate.livingroom_thermostat', 'temperature') }}°C,
                  сейчас {{ states('sensor.livingroom_sensor_temperature') }}°C
        - conditions:
            - condition: trigger
              id: relay_on
          sequence:
            - action: timer.start
              target:
                entity_id: timer.livingroom_heat_cycle_cap
            - action: logbook.log
              data:
                name: "Котёл"
                entity_id: switch.virtual_heating_relay
                message: >
                  Предел топки 12 минут: цель {{ state_attr('climate.livingroom_thermostat', 'temperature') }}°C,
                  сейчас {{ states('sensor.livingroom_sensor_temperature') }}°C
        - conditions:
            - condition: trigger
              id: sensor
            - condition: template
              value_template: >
                {{ trigger.from_state is not none
                   and trigger.from_state.state != trigger.to_state.state }}
            - condition: state
              entity_id: switch.virtual_heating_relay
              state: "on"
            - condition: state
              entity_id: timer.livingroom_heat_cycle_cap
              state: idle
            - condition: template
              value_template: >
                {% set target = state_attr('climate.livingroom_thermostat', 'temperature') | float(none) %}
                {% set current = states('sensor.livingroom_sensor_temperature') | float(none) %}
                {{ target is none or current is none or (target - current) <= 1.2 }}
          sequence:
            - action: timer.start
              target:
                entity_id: timer.livingroom_heat_cycle_cap
            - action: logbook.log
              data:
                name: "Котёл"
                entity_id: switch.virtual_heating_relay
                message: >
                  Дельта стала не больше 1,2°C, с этой секунды предел 12 минут:
                  цель {{ state_attr('climate.livingroom_thermostat', 'temperature') }}°C,
                  сейчас {{ states('sensor.livingroom_sensor_temperature') }}°C
  mode: queued
  max: 10

- id: livingroom_heat_cycle_cap_fire
  alias: Гостиная — отсечка топки по таймеру
  description: >
    Двенадцать минут у цели истекли. Выключается виртуальное реле,
    не котёл: синхронизатор сам переводит climate.boiler_kotel в off.
    Термостат видит внешнее выключение и не включает тепло раньше
    паузы 5 минут и нового показания.
  triggers:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.livingroom_heat_cycle_cap
  conditions:
    - condition: state
      entity_id: switch.virtual_heating_relay
      state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.virtual_heating_relay
    - action: logbook.log
      data:
        name: "Котёл"
        entity_id: switch.virtual_heating_relay
        message: >
          Отсечка топки: 12 минут у цели,
          сейчас {{ states('sensor.livingroom_sensor_temperature') }}°C
  mode: single

- id: away_reminder
  alias: Напоминание — не забыли включить режим "уехали"
  description: >
    Если хозяев нет дома дольше 4 часов, а режим away так и не включён
    вручную — присылаем напоминание в Telegram. Ничего не переключаем
    автоматически: дома может ночевать сестра, решение всегда за человеком.
  triggers:
    - trigger: state
      entity_id: group.family
      to: not_home
      for: "04:00:00"
  conditions:
    - condition: template
      value_template: >
        {{ state_attr('climate.livingroom_thermostat', 'preset_mode') != 'away' }}
  actions:
    - action: notify.me
      data:
        message: >
          🏠 Хозяев нет дома уже 4+ часа, а режим "away" не включён.
          Сейчас в термостате режим: {{ state_attr('climate.livingroom_thermostat', 'preset_mode') }}
          🌡 Гостиная: {{ states('sensor.livingroom_sensor_temperature') | float(0) | round(1) }}°C
          Если дома никого не осталось — включи /away вручную.
  mode: single

- id: hasp_thermostat_temp_adjust
  alias: "Регулировка температуры термостата с панели openHASP"
  trigger:
    - platform: mqtt
      topic: hasp/plate1/state/p3b11
    - platform: mqtt
      topic: hasp/plate1/state/p3b12
  action:
    - variables:
        cur_temp: "{{ state_attr('climate.livingroom_thermostat', 'temperature') | float(0) }}"
        min_temp: "{{ state_attr('climate.livingroom_thermostat', 'min_temp') | float(14) }}"
        max_temp: "{{ state_attr('climate.livingroom_thermostat', 'max_temp') | float(28) }}"
        step: 0.1
        direction: >
          {% if trigger.topic.endswith('p3b11') %}-{% elif trigger.topic.endswith('p3b12') %}+{% endif %}
        new_temp: >
          {% if direction == '-' %}
            {{ [cur_temp - step, min_temp] | max }}
          {% elif direction == '+' %}
            {{ [cur_temp + step, max_temp] | min }}
          {% else %}
            {{ cur_temp }}
          {% endif %}
    - service: climate.set_temperature
      target:
        entity_id: climate.livingroom_thermostat
      data:
        temperature: "{{ new_temp | round(1) }}"
    - condition: state
      entity_id: input_boolean.climate_daily
      state: 'on'
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.climate_daily
    - delay: "00:00:0.4"

- id: boiler_count_starts
  alias: Счётчик включений горелки
  description: >
    Подтверждённый старт горелки (5 секунд) увеличивает часовой счётчик.
    Пока котёл в режиме heat, тот же старт увеличивает счётчик текущего
    цикла — его обнуляет gas_boiler_sync при включении и читает при выключении.
  trigger:
    - platform: state
      entity_id: binary_sensor.boiler_gorelka
      from: 'off'
      to: 'on'
      for: 00:00:05
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.boiler_starts_last_hour
      data:
        value: '{{ states(''input_number.boiler_starts_last_hour'') | int + 1 }}'
    - condition: state
      entity_id: climate.boiler_kotel
      state: heat
    - service: input_number.set_value
      target:
        entity_id: input_number.boiler_starts_current_cycle
      data:
        value: '{{ states(''input_number.boiler_starts_current_cycle'') | int(0) + 1 }}'

- id: boiler_reset_hourly
  alias: Сброс счётчика горелки каждый час
  trigger:
    - platform: time_pattern
      minutes: 0
      seconds: 0
  action:
    - service: input_number.set_value
      data:
        entity_id: input_number.boiler_starts_previous_hour
        value: "{{ states('input_number.boiler_starts_last_hour') | int }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.boiler_starts_last_hour
      data:
        value: 0
  mode: single

- id: notify_boiler_error
  alias: Уведомление об ошибке котла
  description: >
    В Telegram только текст ошибки, который прислал контроллер.
    unavailable и unknown — это обрыв MQTT или старт HA, не неисправность
    котла. Такие переходы пишутся в boiler_link.jsonl и сюда не попадают.
  trigger:
    - platform: state
      entity_id: sensor.boiler_oshibki
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['нет', 'unavailable', 'unknown', 'none', '']
           and (trigger.from_state is none
                or trigger.from_state.state != trigger.to_state.state) }}
  action:
    - service: notify.me
      data:
        message: >
          ⚠️ Ошибка котла: {{ trigger.to_state.state }}
  mode: single

- id: notify_boiler_error_cleared
  alias: Ошибка котла устранена
  triggers:
    - trigger: state
      entity_id: sensor.boiler_oshibki
      to: "нет"
  conditions:
    - condition: template
      value_template: >
        {{ trigger.from_state.state not in ['нет', 'unavailable', 'unknown', 'none', ''] }}
  actions:
    - action: notify.me
      data:
        message: >
          ✅ Ошибка котла устранена (была: {{ trigger.from_state.state }}).
  mode: single

- id: report_indoor_temp
  alias: Report indoor temp to SmartTherm controller
  description: >
    Передача комнатной температуры в SmartTherm.
    Проверка каждые 10 секунд, значение отправляется только
    при изменении не менее чем на 0.05°C.
  triggers:
    - trigger: time_pattern
      seconds: /10

  variables:
    source_entity: sensor.livingroom_sensor_temperature
    target_entity: number.boiler_t_indoor

  conditions:
    - condition: template
      value_template: >
        {{ states(source_entity) not in ['unavailable', 'unknown']
           and is_number(states(source_entity)) }}

  actions:
    - if:
        - condition: template
          value_template: >
            {{ (states(source_entity)|float(0) -
                states(target_entity)|float(0))
               | abs >= 0.05 }}
      then:
        - action: number.set_value
          target:
            entity_id: "{{ target_entity }}"
          data:
            value: "{{ states(source_entity)|float(0)|round(2) }}"

  mode: single

- id: report_outdoor_temp
  alias: Report outdoor temp to SmartTherm controller
  description: >
    Передача уличной температуры в SmartTherm.
    Используется местный датчик, при его недоступности — температура
    из прогноза погоды. Если в контроллере ещё нет числа (unknown),
    значение отправляется сразу: иначе проверка is_number по цели
    никогда не пропускает первую запись. Дальше — только при изменении
    не менее чем на 0.05°C. Ноль на улице считается настоящей температурой,
    поэтому неизвестную цель нельзя подменять float(0).
  triggers:
    - trigger: time_pattern
      seconds: /30

  variables:
    source_entity: sensor.yard_sensor_temperature
    weather_entity: weather.forecast_house_lenina
    target_entity: number.boiler_t_outdoor

  actions:
    - variables:
        source_value: >-
          {% if is_number(states(source_entity)) %}
            {{ states(source_entity) | float }}
          {% elif is_number(state_attr(weather_entity, 'temperature')) %}
            {{ state_attr(weather_entity, 'temperature') | float }}
          {% else %}
            {{ none }}
          {% endif %}

    - if:
        - condition: template
          value_template: >
            {{ is_number(source_value) and (
                 not is_number(states(target_entity))
                 or (source_value | float - states(target_entity) | float) | abs >= 0.05
               ) }}
      then:
        - action: number.set_value
          target:
            entity_id: "{{ target_entity }}"
          data:
            value: "{{ source_value | float | round(2) }}"

  mode: single

- id: yard_sensor_unavailable_alert
  alias: Уличный датчик температуры — потеря связи
  description: >
    Уведомление, только если сенсор реально недоступен продолжительное
    время (10 минут), а не просто на секунду после рестарта HA.
  triggers:
    - trigger: state
      entity_id: sensor.yard_sensor_temperature
      to:
        - 'unavailable'
        - 'unknown'
      for: '00:10:00'
  actions:
    - service: notify.me
      data:
        message: >
          ⚠️ Уличный датчик температуры недоступен уже 10+ минут.
          Отопление временно берёт уличную температуру из прогноза погоды.
  mode: single

- id: yard_sensor_recovered_alert
  alias: Уличный датчик температуры — связь восстановлена
  triggers:
    - trigger: state
      entity_id: sensor.yard_sensor_temperature
      from:
        - 'unavailable'
        - 'unknown'
  conditions:
    - condition: template
      value_template: >
        {{ (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) > 600 }}
  actions:
    - service: notify.me
      data:
        message: "🟢 Уличный датчик температуры снова на связи."
  mode: single

# ---------------------------------------------------------------------
# Сырой журнал котла, /config/boiler_link.jsonl, одна JSON-строка
# на событие. Связь, горелка, циклы heat/off, текст ошибки, потолок
# уставки. Выжимку в Telegram из этого файла пока не собираем.
# Поля собирает макрос boiler_link_record в custom_templates.
# ---------------------------------------------------------------------

- id: boiler_link_snapshot
  alias: Диагностика связи котла — снимок
  description: >
    Фоновый снимок раз в 15 минут: ping, потери, RTT, MQTT-состояние
    котла, память контроллера и контрольные хосты сети.
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('snapshot') | base64_encode | replace('\\n', '') }}"
  mode: single

- id: boiler_link_boot
  alias: Диагностика связи котла — старт HA
  description: >
    Отметка перезапуска Home Assistant, чтобы обрыв записи не путать
    с обрывом контроллера. Пауза даёт ping-сенсорам снять первый цикл.
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - delay:
        seconds: 60
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('boot') | base64_encode | replace('\\n', '') }}"
  mode: single

- id: boiler_link_mqtt_down
  alias: Диагностика связи котла — MQTT недоступен
  description: >
    MQTT-климат котла недоступен 15 секунд. Более короткие мигания
    не пишем. Если вместе с ним недоступны и ping, и часы Awtrix,
    это старт HA, а не контроллер.
  triggers:
    - trigger: state
      entity_id: climate.boiler_kotel
      to: unavailable
      for: "00:00:15"
  conditions:
    - condition: template
      value_template: >
        {{ not (
             states('binary_sensor.gas_ping') in ['unavailable', 'unknown']
             and states('binary_sensor.192_168_0_185') in ['unavailable', 'unknown']
           ) }}
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('mqtt_down', none, trigger.from_state.state, 'unavailable', 'climate.boiler_kotel') | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 20

- id: boiler_link_mqtt_up
  alias: Диагностика связи котла — MQTT восстановлен
  description: >
    Длительность берётся от момента ухода в unavailable, поэтому в строке
    виден полный простой, а не только хвост после 15-секундного порога.
  triggers:
    - trigger: state
      entity_id: climate.boiler_kotel
      from: unavailable
  conditions:
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['unavailable', 'unknown']
           and (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) >= 15 }}
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('mqtt_up', (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) | round(1), trigger.from_state.state, trigger.to_state.state, 'climate.boiler_kotel') | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 20

- id: boiler_link_ping
  alias: Диагностика связи котла — ping
  description: >
    Края binary_sensor.gas_ping. gap_s на переходе в on — сколько
    хост не отвечал. Переходы через unavailable (рестарт HA) не пишем.
  triggers:
    - trigger: state
      entity_id: binary_sensor.gas_ping
      from:
        - "on"
        - "off"
      to:
        - "on"
        - "off"
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('ping', (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) | round(1), trigger.from_state.state, trigger.to_state.state, 'binary_sensor.gas_ping') | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 20

- id: boiler_link_usb
  alias: Диагностика связи котла — питание USB
  description: >
    Цикл switch.gas_usb. Так в файле видно, перезапускал ли watchdog
    контроллер, без чтения журнала автоматизаций.
  triggers:
    - trigger: state
      entity_id: switch.gas_usb
      from:
        - "on"
        - "off"
      to:
        - "on"
        - "off"
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('usb', (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) | round(1), trigger.from_state.state, trigger.to_state.state, 'switch.gas_usb') | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 10

- id: boiler_link_peer
  alias: Диагностика связи котла — контрольный хост
  description: >
    Часы Awtrix и панель — другие Wi-Fi клиенты, координатор Zigbee —
    устройство в LAN. Если пропадает только котёл, а эти трое на связи,
    причина на стороне контроллера или его радиолинка.
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.192_168_0_185
        - binary_sensor.openhasp_panel
        - binary_sensor.192_168_0_50
      from:
        - "on"
        - "off"
      to:
        - "on"
        - "off"
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('peer', (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) | round(1), trigger.from_state.state, trigger.to_state.state, trigger.entity_id) | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 20

- id: boiler_link_burner
  alias: Журнал котла — горелка
  description: >
    Края binary_sensor.boiler_gorelka. gap_s на выключении — сколько
    горела. Переходы через unavailable не пишем.
  triggers:
    - trigger: state
      entity_id: binary_sensor.boiler_gorelka
      from:
        - "on"
        - "off"
      to:
        - "on"
        - "off"
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('burner', (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) | round(1), trigger.from_state.state, trigger.to_state.state, 'binary_sensor.boiler_gorelka') | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 30

- id: boiler_link_heat
  alias: Журнал котла — цикл обогрева
  description: >
    Смена режима climate.boiler_kotel между heat и off. Это цикл,
    который запросила автоматика, а не каждый такт горелки.
  triggers:
    - trigger: state
      entity_id: climate.boiler_kotel
      from:
        - heat
        - "off"
      to:
        - heat
        - "off"
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('heat', (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) | round(1), trigger.from_state.state, trigger.to_state.state, 'climate.boiler_kotel') | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 20

- id: boiler_link_error
  alias: Журнал котла — текст ошибки
  description: >
    Любая смена sensor.boiler_oshibki, включая unavailable. В Telegram
    из этой автоматизации ничего не уходит.
  triggers:
    - trigger: state
      entity_id: sensor.boiler_oshibki
  conditions:
    - condition: template
      value_template: >
        {{ trigger.from_state is none
           or trigger.from_state.state != trigger.to_state.state }}
  actions:
    - action: shell_command.boiler_link_append
      data:
        payload_b64: "{% import 'boiler_link.jinja' as bl %}{{ bl.boiler_link_record('error', none, trigger.from_state.state if trigger.from_state is not none else none, trigger.to_state.state, 'sensor.boiler_oshibki') | base64_encode | replace('\\n', '') }}"
  mode: queued
  max: 20

- id: boiler_link_trim
  alias: Диагностика связи котла — обрезка лога
  description: >
    Раз в сутки оставляет последние 8000 строк boiler_link.jsonl.
    Этого хватает примерно на два месяца снимков.
  triggers:
    - trigger: time
      at: "04:10:00"
  actions:
    - action: shell_command.trim_boiler_link_log
  mode: single