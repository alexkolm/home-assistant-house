- id: panel_weather_charts
  alias: Отображение графиков погоды
  triggers:
    - trigger: state
      entity_id: number.plate1_page_number
      to: '6'
    - trigger: state
      entity_id: light.plate1_backlight
      to: 'on'
  conditions:
    - condition: state
      entity_id: number.plate1_page_number
      state: '6'
  actions:
    - action: openhasp.push_image
      continue_on_error: true
      target:
        entity_id: openhasp.plate1
      data:
        obj: p6b1
        image: http://192.168.0.101/weather/temperature.jpg
        width: 470
        height: 200
    - action: openhasp.push_image
      continue_on_error: true
      target:
        entity_id: openhasp.plate1
      data:
        obj: p6b2
        image: http://192.168.0.101/weather/precipitation.jpg
        width: 470
        height: 200
  mode: single

- id: openhasp_weather_daily
  alias: Обновление посуточной погоды на панели plate1
  mode: restart
  trigger:
    - platform: state
      entity_id: sensor.openhasp_weather_daily
    - platform: mqtt
      topic: hasp/plate1/LWT
      payload: "online"
  action:
    - repeat:
        count: 5
        sequence:
          - variables:
              i: "{{ repeat.index }}"
              base: "{{ 31 + (repeat.index - 1) * 10 }}"
              item: >
                {{ state_attr(
                  'sensor.openhasp_weather_daily',
                  'weather_display'
                )[repeat.index] }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p2b{{ base }}.text"
              payload: >
                  {{ item.date | replace('\n', ' ') | regex_replace('\s+', ' ') | trim }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p2b{{ base + 1 }}.text"
              payload: >
                {{ item.temperature | float(0) | round(1) }}°
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p2b{{ base + 2 }}.text"
              payload: >
                {{ item.templow | float(0) | round(1) }}°
          - service: mqtt.publish
            data:
              topic: hasp/plate1/command/jsonl
              payload: >
                {{ {
                  'page': 2,
                  'id': base + 3,
                  'text': item.icon | trim,
                  'text_color': item.color | trim
                } | to_json }}

- id: openhasp_weather_hourly
  alias: Обновление почасовой погоды на панели plate1
  mode: restart
  trigger:
    - platform: state
      entity_id: sensor.openhasp_weather_daily
      attribute: weather_hourly_display
    - platform: mqtt
      topic: hasp/plate1/LWT
      payload: "online"
  action:
    - repeat:
        count: 12
        sequence:
          - variables:
              i: "{{ repeat.index - 1 }}"
              item: >
                {{ state_attr(
                  'sensor.openhasp_weather_daily',
                  'weather_hourly_display'
                )[repeat.index - 1] }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/jsonl"
              payload: >
                {{ {
                  'page': 5,
                  'id': 10 + i,
                  'text': item.icon | trim,
                  'text_color': item.color | trim
                } | to_json }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 30 + i }}.hidden"
              payload: >
                {{ '1' if item.precipitation | float(0) == 0 else '0' }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 50 + i }}.hidden"
              payload: >
                {{ '1' if item.precipitation | float(0) <= 1 else '0' }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 70 + i }}.text"
              payload: >
                {{ item.precipitation | float(0) | round(1) }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 91 + i }}.text"
              payload: >
                {{ item.temperature | float(0) | round(1) }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 110 + i }}.text"
              payload: >
                {{ item.wind_direction }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/p5b{{ 130 + i }}.text"
              payload: >
                {{ item.wind_speed | float(0) | round(1) }}
          - service: mqtt.publish
            data:
              topic: "hasp/plate1/command/jsonl"
              payload: >
                {% import 'weather_helpers.jinja' as wx %}
                {{ {
                  'page': 5,
                  'id': 150 + i,
                  'points': wx.wind_arrow(item.wind_direction | trim)
                } | to_json }}

- id: awtrix_right_button_wled
  alias: AWTRIX — правая кнопка — подсветка под кроватью
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.awtrix_1ed68c_button_right
      to: "on"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.wled_plug
              state: "off"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.wled_plug
            - delay:
                seconds: 3
            - service: rest_command.wled_preset_2
        - conditions:
            - condition: state
              entity_id: switch.wled_plug
              state: "on"
            - condition: state
              entity_id: light.wled
              state: "off"
          sequence:
            - service: rest_command.wled_preset_2
        - conditions:
            - condition: state
              entity_id: switch.wled_plug
              state: "on"
            - condition: state
              entity_id: light.wled
              state: "on"
          sequence:
            - service: rest_command.wled_preset_1

- id: button_door_open
  alias: Домофон — открыть с кнопки (Zigbee)
  mode: single
  trigger:
    - platform: mqtt
      topic: "zigbee2mqtt_poe/button_door/action"
      payload: "single"
  condition: []
  action:
    - parallel:
        - sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.domofon_door_rest
        - sequence:
            - service: media_player.play_media
              continue_on_error: true
              target:
                entity_id: !secret yandex_station_livingroom
              data:
                media_content_id: Кнопка нажата
                media_content_type: text
                extra:
                  volume_level: 0.7

- id: bedroom_presence_detected
  alias: Спальня - обнаружено присутствие
  trigger:
    - platform: state
      entity_id: binary_sensor.human_sensor_bedroom_presence
      to: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.bedroom_presence_state
    - service: timer.cancel
      target:
        entity_id: timer.bedroom_presence_off_delay
  mode: restart

- id: bedroom_presence_lost
  alias: Спальня - датчик потерял присутствие
  trigger:
    - platform: state
      entity_id: binary_sensor.human_sensor_bedroom_presence
      to: "off"
  action:
    - service: timer.start
      target:
        entity_id: timer.bedroom_presence_off_delay
  mode: restart

- id: bedroom_presence_timeout
  alias: Спальня - виртуальное присутствие выключено по таймеру
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.bedroom_presence_off_delay
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.bedroom_presence_state
  mode: single

- id: away_script
  alias: Скрипт "Уезжаем надолго"
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: /away
  condition: []
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.notify_away_home
  mode: single

- id: faraway
  alias: Включение режима, когда уезжаем из дома надолго
  trigger:
    - platform: state
      entity_id: input_boolean.notify_away_home
      to: "on"
  condition: []
  action:
    - service: media_player.play_media
      continue_on_error: true
      target:
        entity_id: !secret yandex_station_livingroom
      data:
        media_content_id: Уезжаем надолго
        media_content_type: text
        extra:
          volume_level: 0.7
    - service: notify.me
      continue_on_error: true
      data:
        message: "Скрипт 'Уехали надолго' запущен"
    - service: switch.turn_off
      target:
        entity_id: switch.boiler_plug
    - service: switch.turn_off
      target:
        entity_id:
          - switch.main_floor_relay
          - switch.towel_dryer_plug
    - delay: "00:00:05"
    - service: switch.turn_on
      target:
        entity_id:
          - switch.main_floor_relay
          - switch.towel_dryer_plug
    - choose:
        - conditions:
            - condition: state
              entity_id: climate.livingroom_thermostat
              state: "heat"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.climate_daily
            - service: climate.set_preset_mode
              continue_on_error: true
              target:
                entity_id: climate.livingroom_thermostat
              data:
                preset_mode: "away"
  mode: single

- id: notify_offline_restore_after_48h
  alias: Restore notify_offline after 48h
  mode: restart
  trigger:
    - platform: state
      entity_id: input_boolean.notify_offline
      to: "off"
  action:
    - delay: "48:00:00"
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.notify_offline

- id: bathroom_presence_fan_control
  alias: "Управление вытяжкой по датчику присутствия"
  trigger:
    - platform: state
      entity_id: binary_sensor.human_sensor_bathroom_presence
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.human_sensor_bathroom_presence
              state: 'on'
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.airvent_relay
        - conditions:
            - condition: state
              entity_id: binary_sensor.human_sensor_bathroom_presence
              state: 'off'
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.airvent_relay
  mode: single

- id: house_devices_off
  alias: "Контроль освещения — выключить после 5 часов работы"
  trigger:
    - platform: time_pattern
      minutes: "/30"
  condition: []
  action:
    - if:
        - condition: state
          entity_id: switch.livingroom_relay
          state: "on"
        - condition: template
          value_template: >
            {{ (as_timestamp(now()) - as_timestamp(states.switch.livingroom_relay.last_changed)) > 5 * 3600 }}
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.livingroom_relay
        - service: notify.me
          data:
            message: |
              ⚠️ Реле в гостиной работало более 5 часов.
              Автоматически отключено.
    - if:
        - condition: state
          entity_id: light.torsher_lamp
          state: "on"
        - condition: template
          value_template: >
            {{ (as_timestamp(now()) - as_timestamp(states.light.torsher_lamp.last_changed)) > 5 * 3600 }}
      then:
        - service: light.turn_off
          target:
            entity_id: light.torsher_lamp
        - service: notify.me
          data:
            message: |
              ⚠️ Торшер горел более 5 часов.
              Автоматически отключен.
  mode: parallel
  max: 3

- id: panel_cam_snapshot
  alias: Отображение кадра с домофона
  triggers:
    - seconds: /2
      trigger: time_pattern
  conditions:
    - condition: state
      entity_id: light.plate1_backlight
      state: 'on'
    - condition: state
      entity_id: number.plate1_page_number
      state: '4'
  actions:
    - action: openhasp.push_image
      continue_on_error: true
      target:
        entity_id: openhasp.plate1
      data:
        obj: p4b1
        image: http://192.168.0.101/snapshot.jpg
        width: 480
        height: 270
  mode: restart

- id: munute_tact
  alias: Ежеминутная автоматизация (отображение на панели)
  trigger:
    - platform: time_pattern
      minutes: /1
  action:
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p0b1.text
        payload: '{{ now().strftime("%H:%M") }}'
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p2b3.text
        payload: >
          {% if states("sensor.next_sunrise") not in ['unavailable', 'unknown'] %}
            Восход: {{ states("sensor.next_sunrise") }}
          {% else %}
            Восход: Н/Д
          {% endif %}
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p2b4.text
        payload: >
          {% if states("sensor.next_sunset") not in ['unavailable', 'unknown'] %}
            Закат: {{ states("sensor.next_sunset") }}
          {% else %}
            Закат: Н/Д
          {% endif %}
    - variables:
        preset: "{{ state_attr('climate.livingroom_thermostat', 'preset_mode') | default('none') }}"
        ru_preset_map:
          none: "нет"
          comfort: "комфорт"
          away: "уехали"
          sleep: "сон"
        ru_preset: "{{ ru_preset_map[preset] if preset in ru_preset_map else 'Нет' }}"
        options: ["нет","комфорт","уехали","сон"]
        val: "{{ options.index(ru_preset) if ru_preset in options else 0 }}"
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p3b8.val
        payload: "{{ val }}"

- id: panel_page
  alias: Отображение страницы на панели
  trigger:
    - platform: mqtt
      topic: hasp/plate1/state/page
  action:
    - service: mqtt.publish
      data:
        topic: hasp/plate1/command/p0b2.text
        payload: 'Стр: {{ trigger.payload }}'

- id: livingroom_light
  alias: Переключение основного света в гостиной
  trigger:
    - platform: mqtt
      topic: zigbee2mqtt_poe/livingroom_switch/action
      payload: single_left
  action:
    - service: switch.toggle
      data: {}
      target:
        entity_id:
          - switch.livingroom_relay

- id: kitchen_led_toggle
  alias: Переключение подсветки кухни
  trigger:
    - platform: mqtt
      topic: zigbee2mqtt_poe/kitchen_led_button/action
      payload: single
  action:
    - service: switch.toggle
      target:
        entity_id: switch.kitchen_led_relay

- id: torsher_switch
  alias: Переключение торшера в гостиной
  trigger:
    - platform: mqtt
      topic: zigbee2mqtt_poe/livingroom_switch/action
      payload: single_right
  action:
    - service: light.toggle
      data: {}
      target:
        entity_id:
          - light.torsher_lamp

- id: soil_moisture_check
  alias: Влага почвы — напоминание при понижении
  trigger:
    - platform: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
      for: 00:00:10
    - platform: time
      at: '10:00:00'
  condition:
    - condition: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
  action:
    - service: notify.me
      data:
        message: "Проверьте влажность почвы у цветов в доме\n \U0001F331 Влажность ниже
          100%.\n \n"

- id: gate_open
  alias: Домофон — калитка открыта
  mode: single
  trigger:
    - platform: event
      event_type: call_service
  condition:
    - condition: template
      value_template: >
        {{ trigger.event.data.domain == 'rest_command'
           and trigger.event.data.service == 'domofon_open_door' }}
  action:
    - parallel:
        - sequence:
            - service: media_player.play_media
              continue_on_error: true
              target:
                entity_id: !secret yandex_station_livingroom
              data:
                media_content_id: Замок калитки открыт
                media_content_type: text
                extra:
                  volume_level: 0.7
        - sequence:
            - service: camera.snapshot
              continue_on_error: true
              data:
                entity_id: camera.domofon_audio
                filename: /config/www/domofon.jpg
            - service: shell_command.record_domofon_video
              continue_on_error: true
        - sequence:
            - delay: "00:00:02"
            - service: rest_command.domofon_reject_call
              continue_on_error: true
        - sequence:
            - delay: "00:00:07"
            - service: notify.me
              continue_on_error: true
              data:
                message: ""
                data:
                  photo:
                    - file: /config/www/domofon.jpg
                      caption: "Калитка открыта. Фото 📸"
            - delay: "00:00:02"
            - service: notify.me
              continue_on_error: true
              data:
                message: ""
                data:
                  video:
                    - file: /config/www/domofon.mp4
                      caption: "... и видео 🎥"
            - service: shell_command.delete_domofon_video
              continue_on_error: true

- id: total_info
  alias: Уведомление о потреблении ежесуточно
  trigger:
    - platform: time
      at: 00:01:00
  action:
    - service: notify.me
      data:
        message: "Потреблено за сутки в доме:  \n⚡ Энергия: {{ state_attr('sensor.daily_energy_main',
          'last_period') | float }} кВт⋅ч  \n\U0001F4A7 Вода: {{ state_attr('sensor.daily_water',
          'last_period') | float }} м³\n"

- id: devices_offline_notification
  alias: Оповещение о потере связи с устройствами
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.domofon_ping
        - binary_sensor.videoreg_ping
        - binary_sensor.192_168_0_50
        - binary_sensor.openhasp_panel
        - binary_sensor.gas_ping
      to: 'off'
      for: "00:02:00"
  condition:
    - condition: state
      entity_id: input_boolean.notify_offline
      state: 'on'
  action:
    - service: notify.me
      data:
        message: >
          {% set devices = {
            'binary_sensor.domofon_ping': ['Домофон', '192.168.0.200'],
            'binary_sensor.videoreg_ping': ['Видеосервер', '192.168.0.150'],
            'binary_sensor.192_168_0_50': ['Zigbee-роутер', '192.168.0.50'],
            'binary_sensor.openhasp_panel': ['OpenHASP панель', '192.168.0.120'],
            'binary_sensor.gas_ping': ['SmartTherm', '192.168.0.212']
          } %}
          ША: {{ devices[trigger.entity_id][0] }} ({{ devices[trigger.entity_id][1] }}) не в сети более 2 минут

- id: leaving_home
  alias: Хозяева покинули дом
  trigger:
    platform: state
    entity_id: group.family
    to: not_home
  action:
    - service: notify.me
      data:
        message: 'ША: Все ушли, уведомления об открытии дверей включены'
    - service: switch.turn_on
      data:
        entity_id: switch.ipcam_plug
    - service: switch.turn_off
      data:
        entity_id: switch.wled_plug
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.notify_door

- id: entering_home
  alias: Хозяин вернулся в дом
  trigger:
    platform: state
    entity_id: group.family
    from: not_home
    to: home
  action:
    - service: notify.me
      data:
        message: 'ША: Кто-то из хозяев пришёл в дом, уведомления об открытии дверей отключены'
    - service: switch.turn_off
      data:
        entity_id: switch.ipcam_plug
    - service: switch.turn_on
      data:
        entity_id: switch.wled_plug
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.notify_door

- id: door_open
  alias: Оповещение об открытии дверей дома
  mode: parallel
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.front_door_contact
        - binary_sensor.back_door_contact
      from: 'on'
      to: 'off'
  condition:
    - condition: state
      entity_id: input_boolean.notify_door
      state: 'on'
  variables:
    door_name: "{% if trigger.entity_id == 'binary_sensor.front_door_contact' %}\n
      \ парадной двери \U0001F513\n{% elif trigger.entity_id == 'binary_sensor.back_door_contact'
      %}\n  задней двери \U0001F513\n{% else %}\n  неизвестной двери\n{% endif %}"
  action:
    - service: notify.me
      data:
        message: 'ША: Открытие {{ door_name }}'

- id: sun_set
  alias: Закат (использую для проверки, включен ли сервер)
  trigger:
    - platform: sun
      event: sunset
  action:
    - service: notify.me
      data:
        message: |
          ША: Солнце село 🌅
          temp out {{ states('sensor.yard_sensor_temperature') | float(0) | round(1) }}°C / in {{ states('sensor.bedroom_sensor_temperature') | float(0) | round(1) }}°C
  mode: single

- id: leak_water_protection
  alias: Протечка — перекрытие воды и оповещение
  mode: single
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.leak_kitchen_water_leak
        - binary_sensor.leak_toilet_water_leak
      to: 'on'
  variables:
    leak_place: >
      {% if trigger.entity_id == 'binary_sensor.leak_kitchen_water_leak' %}
        кухне
      {% elif trigger.entity_id == 'binary_sensor.leak_toilet_water_leak' %}
        туалете
      {% else %}
        неизвестном месте
      {% endif %}
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.water_isolation_valve
    - service: notify.me
      data:
        message: "🚨 ПРОТЕЧКА в {{ leak_place }}! Вода перекрыта."
    - service: media_player.play_media
      target:
        entity_id: !secret yandex_station_livingroom
      data:
        media_content_id: "Обнаружена протечка в {{ leak_place }}. Вода перекрыта."
        media_content_type: text
        extra:
          volume_level: 0.9

- id: domofon_ringing
  alias: Вызов на домофоне
  trigger:
    - platform: state
      entity_id: sensor.domofon_call_state
      to: ringing
  condition: []
  action:
    - variables:
        prev_page: "{{ states('number.plate1_page_number') | int(1) }}"
    - service: notify.me
      data:
        message: "📞 Вызов на домофоне"
    - service: media_player.play_media
      target:
        entity_id: !secret yandex_station_livingroom
      data:
        media_content_id: "Вызов на домофоне"
        media_content_type: text
        extra:
          volume_level: 0.7
    - service: number.set_value
      target:
        entity_id: number.plate1_page_number
      data:
        value: 4
    - service: light.turn_on
      target:
        entity_id: light.plate1_backlight
      data:
        brightness_pct: 100
    - delay: "00:01:00"
    - service: number.set_value
      target:
        entity_id: number.plate1_page_number
      data:
        value: "{{ prev_page }}"
    - service: light.turn_off
      target:
        entity_id: light.plate1_backlight
  mode: single