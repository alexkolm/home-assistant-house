  plate1: 
    objects:
      - obj: "p0b1"  # time label on all pages
        properties:
          "text": '{{ now().strftime("%H:%M") }}'
      - obj: "p1b2"  # light-switch toggle button
        properties:
          "val": '{{ 1 if states("light.torsher_lamp") == "on" else 0 }}'
          "text": '{{ "\uE6E8" if is_state("light.torsher_lamp", "on") else "\uE335" | e }}'
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "light.torsher_lamp"
      - obj: "p1b3"  # dropdown
        event:
          "changed":
            - service: notify.me
              data:
                message: |
                  🍎 Выбран фрукт: {{ text }}
                  🕒 Время: {{ now().strftime('%H:%M %d.%m.%Y') }}
                  📱 С панели openHASP
      - obj: "p1b4"  # temperature
        properties:
          "text": '{{ states("sensor.livingroom_sensor_temperature") }}°C'
      - obj: "p2b8"  # humidity
        properties:
          "text": >
            {% set hum = states("sensor.yard_sensor_humidity") %}
            {% if hum != "unavailable" and hum != "unknown" %}
            влажность: {{ hum | float | round(0) }}%
            {% else %}
            влажность: Н/Д
            {% endif %}
      - obj: "p2b5"  # min temperature
        properties:
          "text": >
            {% set temp_min = states("sensor.yard_temperature_min_24h") %}
            {% if temp_min != "unavailable" and temp_min != "unknown" %}
            min: {{ temp_min | float | round(1) }}°C
            {% else %}
            min: Н/Д
            {% endif %}
      - obj: "p2b6"  # max temperature
        properties:
          "text": >
            {% set temp_max = states("sensor.yard_temperature_max_24h") %}
            {% if temp_max != "unavailable" and temp_max != "unknown" %}
            max: {{ temp_max | float | round(1) }}°C
            {% else %}
            max: Н/Д
            {% endif %}
            
            
      # ============================================================
      # ТЕКУЩАЯ ПОГОДА — БОЛЬШОЙ БЛОК
      # ============================================================

      - obj: "p2b14"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[0]['icon'] }}"
          "text_color": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[0]['color'] }}"
            
      - obj: "p2b15" # День недели + текущая дата
        properties:
          "text": >
            {% set days = {
              0: 'понедельник',
              1: 'вторник',
              2: 'среда',
              3: 'четверг',
              4: 'пятница',
              5: 'суббота',
              6: 'воскресенье'
            } %}
            {{ days[now().weekday()] }} {{ now().strftime('%d.%m') }}

      - obj: "p2b16" # Текущая температура
        properties:
          "text": "{{ state_attr('weather.forecast_house_lenina','temperature') | string + '°C' if not is_state('weather.forecast_house_lenina','unavailable') }}"


      - obj: "p2b17" # Описание текущей погоды
        properties:
          "text": >
             {% set cond = states('weather.forecast_house_lenina') %}
             {% if cond == "clear-night" %}ясная ночь
             {% elif cond == 'cloudy' %}облачно
             {% elif cond == 'fog' %}туман
             {% elif cond == 'hail' %}град
             {% elif cond == 'lightning' %}молния
             {% elif cond == 'lightning-rainy' %}гроза
             {% elif cond == 'partlycloudy' %}переменная облачность
             {% elif cond == 'pouring' %}ливень
             {% elif cond == 'rainy' %}дождь
             {% elif cond == 'snowy' %}снег
             {% elif cond == 'snowy-rainy' %}снег с дождём
             {% elif cond == 'sunny' %}солнечно
             {% elif cond == 'windy' %}ветрено
             {% elif cond == 'windy-variant' %}ветрено
             {% elif cond == 'exceptional' %}необычные условия
             {% elif cond == 'unavailable' %}нет данных
             {% else %}{{ cond }}{% endif %}
             
      # ============================================================
      # ДОПОЛНИТЕЛЬНЫЕ ДАННЫЕ ТЕКУЩЕЙ ПОГОДЫ
      # ============================================================

      - obj: "p2b18"
        properties:
          "text": >
            {{ '\uE58C' }} {{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[0]['precipitation'] }} мм

      - obj: "p2b19"
        properties:
          "text": >
            {{ '\uE59D' }} {{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[0]['wind_direction'] }}

      - obj: "p2b20"
        properties:
          "text": >
            {{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[0]['wind_speed'] }} м/с
             
      # ============================================================
      # ПОСУТОЧНЫЙ ПРОГНОЗ
      #
      # [1] — завтра
      # [2] — +2 дня
      # [3] — +3 дня
      # [4] — +4 дня
      # [5] — +5 дней
      #
      # Погодные иконки теперь не PNG, а встроенные
      # Material Design Icons openHASP.
      # Размер glyph — 32 px.
      # ============================================================


      # ---------- ЗАВТРА ----------

      - obj: "p2b31"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[1]['date'] }}"

      - obj: "p2b32"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[1]['temperature'] }}°"

      - obj: "p2b33"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[1]['templow'] }}°"

      - obj: "p2b34"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[1]['icon'] }}"
          "text_color": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[1]['color'] }}"

      # ---------- +2 ДНЯ ----------

      - obj: "p2b41"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[2]['date'] }}"

      - obj: "p2b42"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[2]['temperature'] }}°"

      - obj: "p2b43"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[2]['templow'] }}°"

      - obj: "p2b44"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[2]['icon'] }}"
          "text_color": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[2]['color'] }}"

      # ---------- +3 ДНЯ ----------

      - obj: "p2b51"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[3]['date'] }}"

      - obj: "p2b52"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[3]['temperature'] }}°"

      - obj: "p2b53"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[3]['templow'] }}°"

      - obj: "p2b54"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[3]['icon'] }}"
          "text_color": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[3]['color'] }}"

      # ---------- +4 ДНЯ ----------

      - obj: "p2b61"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[4]['date'] }}"

      - obj: "p2b62"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[4]['temperature'] }}°"

      - obj: "p2b63"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[4]['templow'] }}°"

      - obj: "p2b64"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[4]['icon'] }}"
          "text_color": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[4]['color'] }}"

      # ---------- +5 ДНЕЙ ----------

      - obj: "p2b71"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[5]['date'] }}"

      - obj: "p2b72"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[5]['temperature'] }}°"

      - obj: "p2b73"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[5]['templow'] }}°"

      - obj: "p2b74"
        properties:
          "text": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[5]['icon'] }}"
          "text_color": "{{ state_attr('sensor.openhasp_weather_daily', 'weather_display')[5]['color'] }}"

      # ---------- ЭКРАН КОТЛА ----------             
      - obj: "p3b1"  # состояние горелки
        properties:
          "val": '{{ 1 if is_state("binary_sensor.boiler_gorelka", "on") else 0 }}'
          "text": '{{ "\uE238" if is_state("binary_sensor.boiler_gorelka", "on") else "\uE156" | e }}'
          "bg_color": '{{ "#FFA500" if is_state("binary_sensor.boiler_gorelka", "on") else "#808080" }}'
          "text_color": "white"
      - obj: "p3b2"  # temperature гостиной
        properties:
          "text": >
            {% set temp = states("sensor.livingroom_sensor_temperature") %}
            {% if temp != "unavailable" and temp != "unknown" %}
            t гостиной: {{ temp | float | round(1) }}°C
            {% else %}
            t гостиной: Н/Д
            {% endif %}
      - obj: "p3b3"  # temperature спальни
        properties:
          "text": >
            {% set temp = states("sensor.bedroom_sensor_temperature") %}
            {% if temp != "unavailable" and temp != "unknown" %}
            t спальни: {{ temp | float | round(1) }}°C
            {% else %}
            t спальни: Н/Д
            {% endif %}
      - obj: "p3b4"  # temperature целевая
        properties:
          "text": >
            {% set temp = state_attr('climate.livingroom_thermostat', 'temperature') %}
            {% if temp != "unavailable" and temp != "unknown" %}
            {{ temp | float | round(1) }}
            {% else %}
            Н/Д
            {% endif %}
      - obj: "p3b5"  # temperature теплоносителя
        properties:
          "text": >
            {% set temp = states("sensor.boiler_temperatura_teplonositelia") %}
            {% if temp != "unavailable" and temp != "unknown" %}
            t теплоносителя: {{ temp | float | round(1) }}°C
            {% else %}
            t теплоносителя: Н/Д
            {% endif %}
      - obj: "p3b6"  # счетчик тактов горелки за предыдущий час
        properties:
          "text": >
            {% set count = states('input_number.boiler_starts_previous_hour') %}
            {% if count != "unavailable" and count != "unknown" %}
            Тактов (пред.час): {{ count | int }}
            {% else %}
            Тактов (пред.час): Н/Д
            {% endif %}
      - obj: "p3b8"  # dropdown на панели openHASP
        event:
          "changed":
            - variables:
                preset_map:
                  "нет": "none"
                  "комфорт": "comfort"
                  "уехали": "away"
                  "сон": "sleep"
                preset: "{{ preset_map.get(text, 'none') }}"
            - service: climate.set_preset_mode
              target:
                entity_id: climate.livingroom_thermostat
              data:
                preset_mode: "{{ preset }}"
            - service: notify.me
              data:
                message: |
                  ✅ Режим термостата: {{ text }} ({{ preset }})
                  🕒 {{ now().strftime('%H:%M %d.%m.%Y') }}
                  📱 С панели openHASP
      - obj: "p3b13" # переключатель отопления
        properties:
          "val": '{{ 1 if states("climate.livingroom_thermostat") == "heat" else 0 }}'
        event:
          "up":
            - service: climate.set_hvac_mode
              target:
                entity_id: climate.livingroom_thermostat
              data:
                hvac_mode: "{{ 'heat' if val | int == 1 else 'off' }}"
            - service: notify.me
              data:
                message: |
                  🔥 Отопление {{ 'включено' if val | int == 1 else 'выключено' }}
                  🕒 {{ now().strftime('%H:%M %d.%m.%Y') }}
                  📱 С панели openHASP
                  
      - obj: "p3b15" # переключатель отопления по графику
        properties:
          "val": '{{ 1 if is_state("input_boolean.climate_daily", "on") else 0 }}'
        event:
          "up":
            - service: input_boolean.turn_{{ 'on' if val | int == 1 else 'off' }}
              target:
                entity_id: input_boolean.climate_daily

      - obj: "p4b2"  # домофон — открыть дверь
        properties:
          "text": "ОТКРЫТЬ"
        event:
          "down":
            - target:
                entity_id: switch.domofon_door_rest
              action: switch.turn_on

      - obj: "p4b3"  # домофон — сброс вызова
        properties:
          "text": "СБРОС"
        event:
          "down":
            - service: button.press
              entity_id: button.domofon_reject_call

      # ============================================================
      # СТРАНИЦА 5 — СВЕТ В ГОСТИНОЙ
      # ============================================================

      # Главный свет в гостиной
      - obj: "p5b1"
        properties:
          "val": '{{ 1 if is_state("switch.livingroom_relay", "on") else 0 }}'
          "text": "\uE769"
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "switch.livingroom_relay"

      # Торшер
      - obj: "p5b2"
        properties:
          "val": '{{ 1 if is_state("light.torsher_lamp", "on") else 0 }}'
          "text": "\uE8DD"
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "light.torsher_lamp"

      # Подсветка кухни
      - obj: "p5b3"
        properties:
          "val": '{{ 1 if is_state("switch.kitchen_led_relay", "on") else 0 }}'
          "text": "\uF1E1"
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "switch.kitchen_led_relay"


